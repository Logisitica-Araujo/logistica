<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<title>Gestores FADERMEX</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="manifest" href="manifest.json">

<body>
  <div id="app">
    <div class="arranque">

  <script src="../lib/barcode-detector.js" defer></script>
