<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Traspasos Fadermex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
<style>
/* Layout: barra de prototipo arriba, shell de app con encabezado + pestañas; vistas tipo herramienta. */
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#14202B; --muted:#5A6977; --line:#D6DEE5;
  --accent:#0E7C66; --accent-ink:#FFFFFF; --accent-soft:#DDF1EB;
  --admin-bg:#101418; --admin-ink:#F3E3B5; --admin-gold:#E2AE3A;
  --proto-bg:#1D2833; --proto-ink:#C9D4DE;
  --ok:#1E8E3E; --ok-bg:#E2F4E7; --err:#C8232D; --err-bg:#FDE6E7; --warn:#A86A00; --warn-bg:#FFF2D2;
  --s-nuevo:#1F63D6; --s-nuevo-bg:#E2ECFF;
  --s-recolectado:#9A6400; --s-recolectado-bg:#FFF0CC;
  --s-entregado:#1B7F38; --s-entregado-bg:#DFF3E5;
  --s-ubicado:#7036B8; --s-ubicado-bg:#EFE5FB;
  --s-extraviado:#C8232D; --s-extraviado-bg:#FDE6E7;
  --s-incidencia:#C4440B; --s-incidencia-bg:#FFE8DA;
  --s-paqueteria:#0B6C80; --s-paqueteria-bg:#DAF2F7;
  --s-en_logistica:#38559E; --s-en_logistica-bg:#E5EBF7;
  --s-solicitud:#4E5B67; --s-solicitud-bg:#E8ECF0;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --pv:#0E6E5C; --pv-bg:#D3F1E8; --rb:#A3195B; --rb-bg:#FBDDEB;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1318; --surface:#161D24; --surface-2:#1B242C; --ink:#E4EBF1; --muted:#93A2AF; --line:#2A3540;
  --accent:#34B496; --accent-ink:#06231C; --accent-soft:#12352D;
  --proto-bg:#060A0D; --proto-ink:#A9B6C2;
  --ok:#5BCB7D; --ok-bg:#12301C; --err:#FF6B72; --err-bg:#3A1518; --warn:#F2B84B; --warn-bg:#352708;
  --s-nuevo:#7FAEFF; --s-nuevo-bg:#14284A;
  --s-recolectado:#F2BE4F; --s-recolectado-bg:#33270A;
  --s-entregado:#64D08A; --s-entregado-bg:#123020;
  --s-ubicado:#C19BF5; --s-ubicado-bg:#2A1A45;
  --s-extraviado:#FF7A80; --s-extraviado-bg:#3D1519;
  --s-incidencia:#FF9A5E; --s-incidencia-bg:#3A1E0C;
  --s-paqueteria:#5CCFE6; --s-paqueteria-bg:#0D2E36;
  --s-en_logistica:#9DB4F0; --s-en_logistica-bg:#1A2645;
  --s-solicitud:#B3BFCA; --s-solicitud-bg:#26313B;
  --pv:#5FD3B6; --pv-bg:#0F3229; --rb:#F47FB4; --rb-bg:#3D1328;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1318; --surface:#161D24; --surface-2:#1B242C; --ink:#E4EBF1; --muted:#93A2AF; --line:#2A3540;
  --accent:#34B496; --accent-ink:#06231C; --accent-soft:#12352D;
  --proto-bg:#060A0D; --proto-ink:#A9B6C2;
  --ok:#5BCB7D; --ok-bg:#12301C; --err:#FF6B72; --err-bg:#3A1518; --warn:#F2B84B; --warn-bg:#352708;
  --s-nuevo:#7FAEFF; --s-nuevo-bg:#14284A;
  --s-recolectado:#F2BE4F; --s-recolectado-bg:#33270A;
  --s-entregado:#64D08A; --s-entregado-bg:#123020;
  --s-ubicado:#C19BF5; --s-ubicado-bg:#2A1A45;
  --s-extraviado:#FF7A80; --s-extraviado-bg:#3D1519;
  --s-incidencia:#FF9A5E; --s-incidencia-bg:#3A1E0C;
  --s-paqueteria:#5CCFE6; --s-paqueteria-bg:#0D2E36;
  --s-en_logistica:#9DB4F0; --s-en_logistica-bg:#1A2645;
  --s-solicitud:#B3BFCA; --s-solicitud-bg:#26313B;
  --pv:#5FD3B6; --pv-bg:#0F3229; --rb:#F47FB4; --rb-bg:#3D1328;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}

/* Prototype bar */
.proto{background:var(--proto-bg);color:var(--proto-ink);font-size:13px}
.proto .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:10px}
.proto b{color:#fff;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:11px}
.roles{display:flex;flex-wrap:wrap;gap:6px}
.roles button{background:transparent;border:1px solid #3A4856;color:var(--proto-ink);padding:5px 10px;border-radius:999px;cursor:pointer}
.roles button[aria-pressed="true"]{background:#fff;color:#14202B;border-color:#fff;font-weight:600}
.proto .reset{margin-left:auto;background:none;border:none;color:var(--proto-ink);text-decoration:underline;cursor:pointer}

/* Admin bar */
.adminbar{background:var(--admin-bg);color:var(--admin-ink);border-bottom:3px solid var(--admin-gold)}
.adminbar .wrap{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding-block:8px;font-size:13px}
.adminbar strong{font-family:var(--f-display);letter-spacing:.12em;font-size:15px;color:var(--admin-gold)}

/* Header */
header.app{background:var(--surface);border-bottom:1px solid var(--line)}
header.app .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:12px}
.brand{font-family:var(--f-display);font-size:24px;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.brand .mark{width:30px;height:30px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.who{display:flex;flex-direction:column;line-height:1.2}
.who .p{font-weight:700}
.who .u{font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.tabs button{border:none;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.bellwrap{position:relative}
.bell{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:10px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.bell .count{position:absolute;top:-6px;right:-6px}
.bellpanel{position:absolute;top:calc(100% + 8px);left:0;width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.18);padding:12px;z-index:40;display:grid;gap:6px}
.bellitem{display:grid;gap:2px;text-align:left;border:none;background:var(--surface-2);border-radius:8px;padding:8px 10px;cursor:pointer;border-left:4px solid transparent}
.bellitem.unseen{border-left-color:var(--s-nuevo);background:var(--s-nuevo-bg)}
.logo{width:auto;min-width:54px;height:32px;padding:0 8px;border:2px dashed var(--muted);border-radius:7px;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.08em}
.atag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.06em;padding:3px 9px;border-radius:6px;white-space:nowrap}
.atag.pv{background:var(--pv-bg);color:var(--pv)}
.atag.rb{background:var(--rb-bg);color:var(--rb)}
.count{background:var(--err);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}

main{padding-block:22px 60px}
h1{font-family:var(--f-display);font-size:30px;margin:0 0 4px;letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--f-display);font-size:21px;margin:0 0 10px;letter-spacing:.02em}
.sub{color:var(--muted);margin:0 0 18px;max-width:70ch}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-nuevo{color:var(--s-nuevo);background:var(--s-nuevo-bg)}
.b-recolectado{color:var(--s-recolectado);background:var(--s-recolectado-bg)}
.b-entregado{color:var(--s-entregado);background:var(--s-entregado-bg)}
.b-ubicado{color:var(--s-ubicado);background:var(--s-ubicado-bg)}
.b-extraviado{color:var(--s-extraviado);background:var(--s-extraviado-bg)}
.b-incidencia{color:var(--s-incidencia);background:var(--s-incidencia-bg)}
.b-paqueteria{color:var(--s-paqueteria);background:var(--s-paqueteria-bg)}
.b-en_logistica{color:var(--s-en_logistica);background:var(--s-en_logistica-bg)}
.b-solicitud{color:var(--s-solicitud);background:var(--s-solicitud-bg)}

/* Summary chips */
.summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chip .n{font-family:var(--f-mono);font-weight:700}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin-bottom:14px}
.seg button{border:none;background:none;padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* Cards list */
.list{display:grid;gap:10px}
.tcard{display:grid;grid-template-columns:6px 1fr auto;gap:0 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;padding:0;width:100%}
.tcard:hover{border-color:var(--muted)}
.tcard .stripe{background:currentColor}
.tcard .body{padding:12px 0;min-width:0;display:grid;gap:4px}
.tcard .top{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.tcard .folio{font-family:var(--f-mono);font-weight:700;font-size:16px}
.tcard .route{font-weight:600}
.tcard .desc{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard .side{padding:12px 14px 12px 0;text-align:right;font-size:13px;color:var(--muted);display:grid;align-content:center;gap:2px}
.tcard .side .bultos{font-family:var(--f-mono);color:var(--ink);font-weight:700}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.arrow{color:var(--muted);margin:0 4px}

/* Panels & forms */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
label.f{display:grid;gap:6px;font-weight:600;font-size:14px}
input.t,select.t,textarea.t{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px 12px;width:100%}
textarea.t{min-height:84px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:8px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--err);border-color:var(--err);color:#fff}
.btn.gold{background:var(--admin-gold);border-color:var(--admin-gold);color:#1a1405}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:grid;gap:14px}

/* Stepper */
.steps{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.steps div{flex:1 1 120px;border-top:4px solid var(--line);padding-top:6px;font-size:13px;color:var(--muted);font-weight:600}
.steps div.on{border-color:var(--accent);color:var(--ink)}
.steps div.done{border-color:var(--accent);color:var(--muted)}
.scanbox{border:2px dashed var(--accent);border-radius:12px;padding:22px;text-align:center;background:var(--accent-soft);display:grid;gap:10px;justify-items:center}
.scanbox svg{color:var(--accent)}
.note{font-size:13px;padding:10px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.note.route{background:var(--s-paqueteria-bg);border-color:transparent;color:var(--ink)}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content}
.qty button{border:none;background:var(--surface-2);width:42px;height:42px;font-size:20px;cursor:pointer}
.qty span{min-width:56px;text-align:center;font-family:var(--f-mono);font-weight:700;font-size:18px}

/* Labels (always white — real paper) */
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.label{background:#fff;color:#000;border-radius:6px;padding:12px 14px;box-shadow:0 1px 0 rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.12);font-family:var(--f-body);aspect-ratio:100/62;max-width:100%;display:grid;grid-template-rows:auto auto 1fr auto;gap:4px;position:relative}
.label .lrow{display:flex;justify-content:space-between;gap:8px;font-size:11px;line-height:1.25}
.label .lrow b{font-size:9px;letter-spacing:.08em;color:#444;display:block}
.label .lfolio{font-family:var(--f-mono);font-weight:700;font-size:20px;letter-spacing:.02em}
.label svg.bc{width:100%;height:46px;display:block}
.label .lfoot{display:flex;justify-content:space-between;align-items:end;font-size:10px}
.label .lb{font-family:var(--f-display);font-size:22px;line-height:1}
.label .rp{position:absolute;top:8px;right:10px;font-family:var(--f-mono);font-size:10px;border:1px solid #000;padding:0 4px}
.label .code{font-family:var(--f-mono);font-size:10px;text-align:center}

/* Scanner */
.scanner{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px}
@media (max-width:860px){.scanner{grid-template-columns:1fr}}
.scaninput{font-family:var(--f-mono);font-size:22px;padding:14px;border:2px solid var(--accent);border-radius:10px;width:100%;background:var(--surface)}
.feedback{border-radius:10px;padding:14px;font-weight:600;display:flex;gap:10px;align-items:flex-start;min-height:54px}
.feedback.ok{background:var(--ok-bg);color:var(--ok)}
.feedback.err{background:var(--err-bg);color:var(--err)}
.feedback.warn{background:var(--warn-bg);color:var(--warn)}
.feedback.idle{background:var(--surface-2);color:var(--muted);font-weight:500}
.flash{animation:flash .45s ease}
@keyframes flash{from{transform:scale(1.02)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
.samples{display:flex;flex-wrap:wrap;gap:6px}
.samples button{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:4px 8px;cursor:pointer}
.samples button small{font-family:var(--f-body);color:var(--muted);margin-left:4px}
.queue{display:grid;gap:8px}
.qrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.qrow .pg{font-family:var(--f-mono);font-weight:700}
.qrow .pg.full{color:var(--ok)}
.qrow .pg.part{color:var(--warn)}
.dots{display:flex;gap:3px;margin-top:4px}
.dots i{width:16px;height:6px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--ok)}
.gestorpill{display:flex;align-items:center;gap:10px;background:var(--s-recolectado-bg);color:var(--ink);border-radius:10px;padding:10px 12px}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(8,12,16,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal .box{background:var(--surface);border-radius:14px;width:min(760px,100%);max-height:calc(100% - 20px);overflow:auto;padding:22px}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.dl div{background:var(--surface-2);border-radius:8px;padding:8px 10px}
.dl dt{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.dl dd{margin:2px 0 0;font-weight:600}
.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:7px}
.timeline li{position:relative;padding:0 0 14px 20px}
.timeline li::before{content:"";position:absolute;left:-8px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--tl,var(--muted))}
.timeline .when{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.timeline .what{font-weight:600}
.timeline .detail{font-size:13px;color:var(--muted)}
.timeline li.admin .what{color:var(--warn)}
.actions{border-top:1px solid var(--line);padding-top:14px;margin-top:6px;display:grid;gap:12px}
.inline-form{display:grid;gap:8px;background:var(--surface-2);border-radius:10px;padding:12px}

/* Table */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--surface-2)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}

/* Search */
.searchbar{display:flex;gap:10px;align-items:center;background:var(--surface);border:2px solid var(--admin-gold);border-radius:12px;padding:6px 6px 6px 14px;margin-bottom:18px}
.searchbar input{border:none;background:none;flex:1;min-width:0;font-family:var(--f-mono);font-size:18px;padding:8px 0}
.searchbar input:focus{outline:none}

/* Phone */
.phone{width:min(390px,100%);margin:0 auto;border:10px solid #0b0f13;border-radius:38px;background:var(--bg);overflow:hidden;min-height:700px;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.phone .ph-head{background:var(--s-recolectado-bg);padding:18px 16px 12px}
.phone .ph-body{padding:14px;display:grid;gap:10px;align-content:start;flex:1}
.phone .ph-nav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--surface)}
.phone .ph-nav button{border:none;background:none;padding:12px 4px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.phone .ph-nav button[aria-current="page"]{color:var(--accent)}
.camera{aspect-ratio:4/3;background:#0b0f13;border-radius:12px;position:relative;display:grid;place-items:center;color:#9fb0bf;font-size:13px;max-width:100%}
.camera::after{content:"";position:absolute;left:12%;right:12%;top:50%;height:2px;background:#ff4d4d;box-shadow:0 0 12px #ff4d4d}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.catalog .panel{padding:14px}
.catalog ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px}
.catalog li{display:flex;justify-content:space-between;gap:8px;font-size:14px}

/* ---------- Utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>{const d=new Date();const p=n=>String(n).padStart(2,'0');return `${p(d.getDate())}/${p(d.getMonth()+1)} ${p(d.getHours())}:${p(d.getMinutes())}`};
const role=()=>ROLES.find(r=>r.id===S.role);
const isAdmin=()=>S.role==='ADM';
const vivos=()=>S.T.filter(t=>!t.eliminado);
const byFolio=f=>S.T.find(t=>t.folio===f&&!t.eliminado);
function badge(t){
  let h=`<span class="badge b-${t.estatus}">${ESTATUS[t.estatus]}${t.estatus==='ubicado'?': '+esc(nom(t.ubic)):''}</span>`;
  if(t.solicitud) h+=` <span class="badge b-solicitud">Eliminación solicitada</span>`;
  return h;
}
function toast(msg){$('#toast').innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').innerHTML='',2600)}
let AC=null;
function beep(kind){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();
   o.type=kind==='ok'?'sine':'square';o.frequency.value=kind==='ok'?1320:kind==='warn'?620:220;
   g.gain.value=.06;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+(kind==='ok'?.09:.28));}catch(e){}
}
function notify(para,folio,txt){S.notifs.push({para,folio,txt,t:now(),nuevo:true});}
function addEv(t,txt,d,tl,admin){t.ev.push({t:now(),txt,d:d||'',tl:tl||'',admin:!!admin})}
const ICON={

/* ---------- Render principal ---------- */
function render(){
  $('#roles').innerHTML=ROLES.map(r=>`<button type="button" data-a="role" data-v="${r.id}" aria-pressed="${S.role===r.id}">${r.label}</button>`).join('');
  $('#adminbar').innerHTML=isAdmin()?`<div class="adminbar"><div class="wrap"><strong>MODO ADMINISTRADOR</strong><span>jaraujo@fadermex.com · control total: editar, mover, cambiar estatus y eliminar</span><span style="margin-left:auto">Administradores: jaraujo · Oramirez · sistemasfed</span></div></div>`:'';
  renderHeader();
  const r=role();
  let html='';
  if(r.kind==='punto'){
    if(S.tab==='bandeja')html=viewBandeja();
    else if(S.tab==='nuevo')html=viewNuevo();
    else if(S.tab==='escaner')html=viewEscaner();
    else if(S.tab==='paq')html=viewPaqueteria();
  } else if(r.kind==='gestor') html=viewGestor();
  else html=viewAdmin();
  $('#view').innerHTML=html;
  renderModal();
  drawBarcodes();
  const si=$('#scanin')||$('#gscanin');if(si&&!S.modal)si.focus({preventScroll:true});
}
function renderHeader(){
  const r=role();
  let tabs=[];
  if(r.kind==='punto'){
    tabs=[['bandeja','Mi bandeja'],['nuevo','Nuevo traspaso'],['escaner','Escáner']];
    if(r.id==='LOG'){const n=vivos().filter(t=>t.estatus==='en_logistica'&&isMor(t.destino)).length;tabs.push(['paq','Paquetería',n]);}
  } else if(r.kind==='admin'){
    const n=vivos().filter(t=>t.solicitud).length;
    tabs=[['todos','Todos los traspasos'],['buscar','Buscador'],['sol','Solicitudes',n],['personas','Personas'],['puntos','Sucursales y áreas']];
  }
  const cur=r.kind==='admin'?S.adminTab:S.tab;
  const mins=Math.max(0,720-Math.floor((Date.now()-S.sesion)/60000));
  const who=r.kind==='punto'?`<div class="who"><span class="p">${esc(nom(r.id))}</span><span class="u">${esc(r.user)}${r.equipo?` · esta computadora: <b>${r.equipo}</b>`:''} · sesión: cierra en ${Math.floor(mins/60)} h ${String(mins%60).padStart(2,'0')} min</span></div>`
    :r.kind==='gestor'?`<div class="who"><span class="p">App del gestor</span><span class="u">${esc(r.user)}</span></div>`
    :`<div class="who"><span class="p">Administración</span><span class="u">${esc(r.user)}</span></div>`;
  const mine=S.notifs.filter(n=>n.para===r.id);const unseen=mine.filter(n=>!n.visto).length;
  const bell=r.kind==='punto'?`<div class="bellwrap"><button type="button" class="bell" data-a="bell" aria-label="Avisos" aria-expanded="${S.bell}">${ICON.bell}${unseen?`<span class="count">${unseen}</span>`:''}</button>
    ${S.bell?`<div class="bellpanel"><div class="row" style="justify-content:space-between;margin-bottom:6px"><b>Avisos</b>${unseen?`<button class="btn ghost" type="button" data-a="bellread" style="padding:4px 8px">Marcar como vistos</button>`:''}</div>
     ${mine.length?mine.slice().reverse().map(n=>`<button type="button" class="bellitem ${n.visto?'':'unseen'}" data-a="bellopen" data-v="${n.folio}"><span class="mono" style="font-weight:700">${n.folio}</span><span>${esc(n.txt)}</span><span class="muted mono" style="font-size:12px">${esc(n.t)}</span></button>`).join(''):'<div class="muted">Sin avisos.</div>'}
     <div class="muted" style="font-size:12px;margin-top:8px">En la computadora también sale un aviso del sistema con sonido, aunque la página esté minimizada.</div></div>`:''}</div>`:'';
  $('#header').innerHTML=`<div class="brand"><span class="logo" title="Aquí va la imagen o logo de la empresa">LOGO</span>Traspasos</div>${who}
   ${bell}<nav class="tabs">${tabs.map(([id,l,n])=>`<button type="button" data-a="tab" data-v="${id}" ${cur===id?'aria-current="page"':''}>${l}${n?` <span class="count">${n}</span>`:''}</button>`).join('')}</nav>`;
}

/* ---------- Bandeja ---------- */
function entrantes(me){return vivos().filter(t=>miSuc(t.destino,me)||(me==='LOG'&&t.via==='LOG'&&(!t.pasoLog||t.estatus==='en_logistica')))}
function salientes(me){return vivos().filter(t=>t.origen===me)}
function tcard(t,me){
  const otro=me&&t.origen===me?`<span class="arrow">→</span>${esc(nom(t.destino))}`:`${esc(nom(t.origen))}<span class="arrow">→</span>${esc(nom(t.destino))}`;
  const last=t.ev[t.ev.length-1];
  return `<button type="button" class="tcard" data-a="open" data-v="${t.folio}" style="color:var(--s-${t.estatus})">
   <span class="stripe"></span>
   <span class="body"><span class="top"><span class="folio" style="color:var(--ink)">${t.folio}</span>${badge(t)}${areaTag(t.destino)}</span>
    <span class="route" style="color:var(--ink)">${otro}</span>
    <span class="desc">${esc(t.desc)}</span></span>
   <span class="side"><span class="bultos">${t.bultos} ${t.bultos>1?'bultos':'bulto'}</span><span>${esc(last.t)}</span><span>${esc(last.txt)}</span></span></button>`;
}
function viewBandeja(){
  const me=S.role;
  const src=S.bandejaDir==='in'?entrantes(me):salientes(me);
  const counts={};src.forEach(t=>counts[t.estatus]=(counts[t.estatus]||0)+1);
  const list=src.filter(t=>!S.filtro||t.estatus===S.filtro).sort((a,b)=>order(a)-order(b));
  return `<h1>Mi bandeja</h1><p class="sub">${isOf(me)?`Solo ves los traspasos que van dirigidos a <b>${esc(nom(me))}</b> o que salieron de aquí.`:`<b>Entrantes</b>: todo lo que llega a ${esc(P[me].s)} (PV y Rebotica); cualquiera lo puede recibir y cada traspaso dice para quién es. <b>Salientes</b>: solo lo que sale de ${esc(nom(me))}.`} Esta pantalla es solo para consultar: para recibir o entregar usa el <b>Escáner</b>.</p>
   <div class="seg" role="group"><button type="button" data-a="dir" data-v="in" aria-pressed="${S.bandejaDir==='in'}">Entrantes (${entrantes(me).length})</button><button type="button" data-a="dir" data-v="out" aria-pressed="${S.bandejaDir==='out'}">Salientes (${salientes(me).length})</button></div>
   <div class="summary">${Object.keys(ESTATUS).filter(k=>counts[k]).map(k=>`<button type="button" class="chip" data-a="filtro" data-v="${k}" aria-pressed="${S.filtro===k}"><span class="badge b-${k}">${ESTATUS[k]}</span><span class="n">${counts[k]}</span></button>`).join('')}</div>
   <div class="list">${list.length?list.map(t=>tcard(t,S.bandejaDir==='out'?me:null)).join(''):'<div class="empty">No hay traspasos aquí.</div>'}</div>`;
}

/* ---------- Escaneo: validación ---------- */
function parse(code){
  const m=String(code).trim().toUpperCase().match(/^(.+?-\d{4})(?:-(\d+)\/(\d+))?$/);
  return m?{folio:m[1],b:m[2]?+m[2]:null,tot:m[3]?+m[3]:null}:null;
}
function validar(code,mode,me,lote){
  const p=parse(code);
  if(!p)return {k:'err',m:`"${code}" no es un folio válido. Revisa que esté bien tecleado (ej. NR-0040-1/3).`};
  const t=byFolio(p.folio);
  if(!t)return {k:'err',m:`El folio ${p.folio} no existe. Probablemente se tecleó mal.`};
  if(p.b&&(p.tot!==t.bultos||p.b<1||p.b>t.bultos))return {k:'err',m:`Etiqueta no válida: ${p.folio} tiene ${t.bultos} bultos.`};
  if(t.solicitud)return {k:'err',m:`${t.folio} tiene una solicitud de eliminación pendiente. No se debe mover hasta que responda un administrador.`};
  if(mode==='recibir'){
    const esLog=me==='LOG'&&t.via==='LOG'&&!t.pasoLog;
    if(!miSuc(t.destino,me)&&!esLog)return {k:'err',m:`Este traspaso NO es para ${P[me].s===P[me].n||isOf(me)?nom(me):P[me].s}. Va para: ${nom(t.destino)}.`,t};
    if(t.estatus==='entregado')return {k:'warn',m:`${t.folio} ya fue recibido anteriormente.`};
    const ok=esLog?(isOf(t.origen)?['nuevo','recolectado']:['recolectado','paqueteria']):['recolectado','paqueteria','en_logistica','ubicado','extraviado'];
    if(!ok.includes(t.estatus))return {k:'err',m:t.estatus==='nuevo'?`${t.folio} todavía no ha sido recolectado por gestoría.`:`${t.folio} está como "${ESTATUS[t.estatus]}". No se puede recibir.`};
  } else {
    if(t.estatus==='recolectado')return {k:'warn',m:`${t.folio} ya fue recolectado por ${t.gestor}.`};
    if(mode==='entregar'&&t.origen!==me&&!(me==='LOG'&&t.estatus==='en_logistica'))return {k:'err',m:`${t.folio} no sale de aquí. Sale de: ${nom(t.origen)}.`};
    const ok=(t.estatus==='nuevo'&&!(t.via==='LOG'&&isOf(t.origen)))||(t.estatus==='en_logistica'&&!isMor(t.destino)&&!isOf(t.destino));
    if(!ok)return {k:'err',m:`${t.folio} está como "${ESTATUS[t.estatus]}". No se puede recolectar.`};
  }
  const set=lote[t.folio]||[];
  const nuevos=p.b?[p.b]:Array.from({length:t.bultos},(_,i)=>i+1);
  if(nuevos.every(b=>set.includes(b)))return {k:'warn',m:p.b?`El bulto ${p.b}/${t.bultos} de ${t.folio} ya fue escaneado.`:`${t.folio} ya está en la lista.`};
  lote[t.folio]=[...new Set([...set,...nuevos])].sort();
  const n=lote[t.folio].length;
  return {k:'ok',m:p.b?`${t.folio} · bulto ${p.b}/${t.bultos} · ${n===t.bultos?'completo':`faltan ${t.bultos-n}`}`:`${t.folio} · ${t.bultos} ${t.bultos>1?'bultos':'bulto'} · ${nom(t.origen)} → ${nom(t.destino)}${/-RB$/.test(t.destino)?' · PARA REBOTICA':(!isOf(t.destino)&&P[t.destino].n==='PV')?' · PARA PV':''}`};
}

function onScan(code){
  code=String(code).trim(); if(!code)return;
  const sc=S.scan;
  if(sc.mode==='entregar'&&!sc.gestor){
    const g=S.gestores.find(g=>g.cred===code.toUpperCase());
    if(g){sc.gestor=g;sc.fb={k:'ok',m:`Gestor identificado: ${g.n}. Ahora escanea los bultos.`};beep('ok');}
    else{sc.fb={k:'err',m:`La credencial "${code}" no es de un gestor.`};beep('err');}
    return render();
  }
  sc.fb=validar(code,sc.mode,S.role,sc.lote);beep(sc.fb.k);render();
}
function confirmarLote(lote,mode,me,gestor,medio){
  let inc=0;
  Object.entries(lote).forEach(([f,bs])=>{const t=byFolio(f);const full=bs.length===t.bultos;
    if(mode==='recibir'){
      if(me==='LOG'&&t.via==='LOG'&&!t.pasoLog){t.pasoLog=true;t.estatus='en_logistica';addEv(t,'Recibido en Logística',`Ana Ruiz · ${bs.length}/${t.bultos} bultos · ${isMor(t.destino)?'por enviar a paquetería':'por distribuir'}`,'en_logistica');}
      else if(full){t.estatus='entregado';addEv(t,'Entregado',`Recibido en la computadora de ${nom(me)} · ${bs.length}/${t.bultos} bultos`,'entregado');}
      else{inc++;t.estatus='incidencia';addEv(t,'Recibido con incidencia',`${nom(me)} · llegó ${bs.length}/${t.bultos} · faltan bultos`,'incidencia');}
    } else {
      t.estatus='recolectado';t.gestor=gestor.n;notify(t.destino,t.folio,`Va en camino para ti · lo lleva ${gestor.n}`);
      addEv(t,'Recolectado por gestoría',`${gestor.n} · ${medio} · ${bs.length}/${t.bultos} bultos${full?'':' · ¡INCOMPLETO!'}`,'recolectado');
    }});
  return inc;
}

     <div class="samples" style="margin:-8px 0 18px">${['NR-0041','BOT-0012','D-0027','E-0030','8072 3341'].map(c=>`<button type="button" data-a="qs" data-v="${c}">${c}</button>`).join('')}</div>
     ${t?`<div class="panel">${detailHTML(t,true)}</div>`:q?(sug.length?`<div class="list">${sug.map(x=>tcard(x)).join('')}</div>`:`<div class="empty">No se encontró "${esc(S.search)}".</div>`):''}`;

     ${S.gestores.map(g=>`<tr><td><b>${esc(g.n)}</b></td><td class="mono">${g.cred}</td><td>Gestoría</td><td>Gestor</td><td><button class="btn ghost" type="button" data-a="nop">Desactivar</button></td></tr>`).join('')}
     </tbody></table></div>`;

  return `<h1>Sucursales y áreas</h1><p class="sub">Catálogo editable. Reglas: cada prefijo es único (2 a 5 letras) y no se puede cambiar una vez usado; un área nueva aparece sola en las rutas de todos. PV y Rebotica comparten la cuenta de la sucursal, pero cada computadora queda fija a su área: PV no puede dar entrada ni salida a lo de Rebotica, ni al revés.</p>
   <div class="catalog">${SUCS.map(s=>`<div class="panel"><h2 style="margin:0">${s}</h2><ul>${PUNTOS.filter(p=>p.s===s).map(p=>`<li><span>${esc(p.n)}</span><span class="mono muted">${p.id}-0001</span></li>`).join('')}</ul></div>`).join('')}
   <div class="panel stack" style="border-style:dashed"><h2 style="margin:0">Agregar área o subárea</h2><label class="f">Nombre<input class="t" id="na" placeholder="Ej. Calidad"></label><label class="f">Sucursal<select class="t" id="ns">${SUCS.map(s=>`<option>${s}</option>`).join('')}</select></label><label class="f">Prefijo<input class="t mono" id="np" placeholder="CAL" maxlength="5"></label><button class="btn gold" type="button" data-a="addpunto">Agregar</button></div></div>`;

       <div class="row"><button class="btn gold" type="button" data-a="asave" data-v="${t.folio}">Guardar cambios</button><button class="btn" type="button" data-a="rpall" data-v="${t.folio}">Reimprimir etiquetas</button>

        <label class="f" style="flex:1;min-width:160px">Motivo<select class="t" id="rpm"><option>Etiqueta dañada</option><option>No imprimió</option><option>Se cayó o despegó</option><option>Otro</option></select></label></div>
        <div class="row"><button class="btn primary" type="button" data-a="rpgo" data-v="${t.folio}">Escanear credencial y reimprimir</button><button class="btn ghost" type="button" data-a="frm" data-v="">Cancelar</button></div></div>`:''}
      ${m.form==='del'?`<div class="inline-form"><label class="f">¿Por qué se debe eliminar? (obligatorio)<textarea class="t" id="delm"></textarea></label><div class="muted" style="font-size:13px">No se borra al momento: un administrador revisa tu solicitud. Mientras tanto el traspaso queda congelado.</div>

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,v=el.dataset.v;
  if(a==='bg'&&e.target!==el)return;
  const w=S.wizard;
  switch(a){
   case 'role':S.bell=false;S.role=v;S.tab='bandeja';S.filtro=null;S.modal=null;S.scan={mode:'recibir',lote:{},fb:null,gestor:null};S.wizard={step:1};break;
   case 'tab':if(isAdmin())S.adminTab=v;else S.tab=v;S.filtro=null;break;
   case 'dir':S.bandejaDir=v;S.filtro=null;break;
   case 'filtro':S.filtro=S.filtro===v?null:v;break;
   case 'afiltro':S.adminFiltro=S.adminFiltro===v?null:v;break;
   case 'open':S.modal={folio:v};break;
   case 'bell':S.bell=!S.bell;break;
   case 'bellread':S.notifs.forEach(n=>{if(n.para===S.role)n.visto=true});break;
   case 'bellopen':S.notifs.forEach(n=>{if(n.para===S.role&&n.folio===v)n.visto=true});S.bell=false;S.modal={folio:v};break;
   case 'close':case 'bg':S.modal=null;break;
   case 'frm':S.modal.form=v;S.modal.err=null;break;
   case 'credej':$('#credin').value=v;return credOk(v);
   case 'cred':return credOk($('#credin').value);
   case 'sincred':w.sinCred=true;break;
   case 'sincredok':{const n=$('#scn').value.trim(),num=$('#scnum').value.trim();if(!n||!num){w.err='Escribe tu nombre y número de empleado.';w.step=1;break;}
     let p=S.personas.find(x=>!x.cred&&x.num===num);if(!p){p={cred:null,num,n,punto:S.role};S.personas.push(p);}w.persona=p;w.err=null;w.step=2;break;}
   case 'back':w.step--;w.err=null;break;
   case 'dest':{const d=$('#destin').value;if(!d){toast('Elige un destino');return;}w.destino=d;w.bultos=w.bultos||1;w.step=3;break;}
   case 'qty':w.desc=$('#descin').value;w.bultos=Math.min(30,Math.max(1,(w.bultos||1)+(+v)));break;
   case 'gen':{const d=$('#descin').value.trim();if(!d){w.desc='';w.err='Describe qué envías.';break;}
     const me=S.role;S.counters[me]=(S.counters[me]||0)+1;const folio=`${me}-${String(S.counters[me]).padStart(4,'0')}`;
     const pp=w.persona;const por=pp.cred?`${pp.n} · ${pp.cred}`:`${pp.n} · sin credencial (#${pp.num})`;
     const via=(isMor(me)||isMor(w.destino))?'LOG':undefined;
     const t={folio,origen:me,destino:w.destino,bultos:w.bultos,desc:d,creado:now(),por,estatus:'nuevo',via,ev:[]};
     addEv(t,'Creado',pp.cred?`${pp.n} · credencial ${pp.cred}`:`${pp.n} · SIN CREDENCIAL · No. empleado ${pp.num}`,'nuevo');
     addEv(t,'Etiquetas impresas',Array.from({length:t.bultos},(_,i)=>`${i+1}/${t.bultos}`).join(', '));
     S.T.push(t);notify(t.destino,folio,`Nuevo traspaso para ti desde ${nom(me)}`);S.wizard={step:4,folio};toast(`Folio ${folio} generado · imprimiendo ${t.bultos} etiqueta(s)`);break;}
   case 'otro':S.wizard={step:1};break;
   case 'smode':S.scan={mode:v,lote:{},fb:null,gestor:null};break;
   case 'gclear':S.scan.gestor=null;S.scan.lote={};S.scan.fb=null;break;
   case 'sim':return onScan(v);
   case 'sclear':S.scan.lote={};S.scan.fb=null;break;
   case 'sconfirm':{const sc=S.scan;const n=Object.keys(sc.lote).length;const inc=confirmarLote(sc.lote,sc.mode,S.role,sc.gestor,'credencial escaneada en '+nom(S.role));
     toast(sc.mode==='recibir'?`${n} traspaso(s) recibidos${inc?` · ${inc} con incidencia`:''}`:`${n} traspaso(s) entregados a ${sc.gestor.n}`);sc.lote={};sc.fb=null;break;}
   case 'gtab':S.gtab=v;break;
   case 'gsim':S.gscan.fb=validar(v,'gestor',null,S.gscan.lote);beep(S.gscan.fb.k);break;
   case 'gconfirm':{const n=Object.keys(S.gscan.lote).length;confirmarLote(S.gscan.lote,'gestor',null,{n:'Luis Gómez'},'celular');S.gscan={lote:{},fb:null};S.gtab='poder';toast(`${n} traspaso(s) recolectados`);break;}
   case 'enviarpq':{const t=byFolio(v);const g=$('#gu-'+v).value.trim();if(!g){toast('Captura el número de guía');return;}
     t.estatus='paqueteria';t.guia=`${$('#pq-'+v).value} · ${g}`;notify(t.destino,t.folio,`Va en camino por paquetería · ${t.guia}`);addEv(t,'Enviado por paquetería',t.guia+' · Logística','paqueteria');toast(`${v} enviado`);break;}
   case 'rpgo':{const t=byFolio(v);const b=+$('#rpb').value,mot=$('#rpm').value;t.rp=t.rp||{};
     const bs=b?[b]:Array.from({length:t.bultos},(_,i)=>i+1);bs.forEach(x=>t.rp[x]=(t.rp[x]||0)+1);
     addEv(t,b?`Reimpresión bulto ${b}/${t.bultos}`:'Reimpresión de todas las etiquetas',`${(S.personas.find(p=>p.punto===S.role&&p.cred)||{n:'Usuario'}).n} · motivo: ${mot.toLowerCase()}`);S.modal.form=null;toast('Etiqueta reenviada a la etiquetadora');break;}
   case 'rpall':{const t=byFolio(v);t.rp=t.rp||{};for(let i=1;i<=t.bultos;i++)t.rp[i]=(t.rp[i]||0)+1;addEv(t,'Reimpresión de todas las etiquetas','jaraujo@fadermex.com (administrador)','',true);toast('Etiquetas reenviadas');break;}
   case 'delgo':{const t=byFolio(v);const mt=$('#delm').value.trim();if(!mt){S.modal.err='Escribe el motivo.';break;}
     t.solicitud={motivo:mt,por:nom(S.role),f:now()};addEv(t,'Solicitud de eliminación',`${nom(S.role)} · "${mt}"`,'solicitud');S.modal.form=null;toast('Solicitud enviada a los administradores');break;}
   case 'solsi':{const t=byFolio(v);const c=$('#cm-'+v).value.trim();t.eliminado=true;S.bitacora.push({t:now(),txt:`jaraujo eliminó ${v} (solicitud aprobada)${c?' · '+c:''}`});toast(`${v} eliminado`);break;}
   case 'solno':{const t=byFolio(v);const c=$('#cm-'+v).value.trim();addEv(t,'Solicitud rechazada',`jaraujo@fadermex.com${c?' · "'+c+'"':''}`,'',true);delete t.solicitud;toast('Solicitud rechazada; el traspaso sigue activo');break;}
   case 'asave':{const t=byFolio(v);const est=$('#aest').value,dest=$('#adest').value,ub=$('#aubic').value,mot=$('#amot').value.trim();const ch=[];
     if(est!==t.estatus){ch.push(`estatus: ${ESTATUS[t.estatus]} → ${ESTATUS[est]}`);t.estatus=est;}
     if(est==='ubicado'&&ub!==t.ubic){t.ubic=ub;ch.push(`ubicación: ${nom(ub)}`);}
     if(dest!==t.destino){ch.push(`destino: ${nom(t.destino)} → ${nom(dest)}`);t.destino=dest;}
     if(!ch.length){toast('Sin cambios');return;}
     addEv(t,'Editado por administrador',`jaraujo@fadermex.com · ${ch.join(' · ')}${mot?' · motivo: '+mot:''}`,est,true);S.bitacora.push({t:now(),txt:`jaraujo editó ${v}: ${ch.join(', ')}`});toast('Cambios guardados');break;}
   case 'adelask':S.modal=S.modal||{folio:v};S.modal.confirmDel=v;break;
   case 'adelno':S.modal.confirmDel=null;break;
   case 'adel':{const t=byFolio(v);t.eliminado=true;S.bitacora.push({t:now(),txt:`jaraujo eliminó ${v}`});S.modal=null;S.search='';toast(`${v} eliminado`);break;}
   case 'qs':S.search=v;break;
   case 'asigcred':{const p=S.personas.find(x=>x.n===v);const n=S.personas.filter(x=>x.cred).length+1;p.cred=`EMP-0${500+n}`;toast(`Credencial ${p.cred} asignada a ${p.n}; su historial queda vinculado`);break;}
   case 'addpunto':{const n=$('#na').value.trim(),s=$('#ns').value,pf=$('#np').value.trim().toUpperCase();
     if(!n||!/^[A-Z]{2,5}$/.test(pf)){toast('Nombre y prefijo de 2 a 5 letras');return;}if(P[pf]){toast(`El prefijo ${pf} ya existe`);return;}
     const p={id:pf,n,s};PUNTOS.push(p);P[pf]=p;toast(`${n} agregado; ya aparece en todas las rutas`);break;}
   case 'nop':toast('En el sistema real: desactiva la credencial al momento');return;
   default:return;
  }
  render();
});
function credOk(code){
  const w=S.wizard;const p=S.personas.find(x=>x.cred&&x.cred===String(code).trim().toUpperCase());
  if(!p){w.err=`La credencial "${code}" no está registrada.`;beep('err');}else{w.persona=p;w.err=null;w.step=2;beep('ok');}
  render();
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.modal){S.modal=null;render();return;}
  if(e.key!=='Enter')return;
  const id=e.target.id;
  if(id==='scanin'){e.preventDefault();onScan(e.target.value);}
  else if(id==='gscanin'){e.preventDefault();S.gscan.fb=validar(e.target.value,'gestor',null,S.gscan.lote);beep(S.gscan.fb.k);render();}
  else if(id==='credin'){e.preventDefault();credOk(e.target.value);}
});
document.addEventListener('change',e=>{if(e.target.id==='destin'){$('#rutanote').innerHTML=rutaNote(S.role,e.target.value);}});
document.addEventListener('input',e=>{if(e.target.id==='descin')S.wizard.desc=e.target.value;});
document.addEventListener('submit',e=>{if(e.target.dataset.form==='search'){e.preventDefault();S.search=$('#searchin').value;render();}});
$('#reset').addEventListener('click',()=>{const r=S.role;S=seed();S.role=r;render();toast('Datos de ejemplo reiniciados');});
render();
</script>

</body>
