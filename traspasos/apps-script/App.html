<script>
/***********************************************************************
 * TRASPASOS FADERMEX — App.html (lo que corre en la computadora)
 ***********************************************************************/
var S = {
  token: null, ctx: null, cat: null, A: {}, E: {}, EC: {},
  data: { traspasos: [], activos: [], avisos: [], solicitudes: [] },
  tab: 'bandeja', dir: 'in', filtro: null,
  wiz: { step: 1 },
  scan: { modo: 'RECIBIR', lote: [], fb: null, gestor: null, log: [], enviando: false },
  modal: null, bell: false, q: '', timer: null, ocupado: false, noVistos: 0,
  caja: { lista: [], fb: null, enviando: false }
};

/* ---------- utilidades ---------- */
function $(s) { return document.querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function guardar(k, v) { try { localStorage.setItem('trasp_' + k, v); } catch (e) { } }
function leer(k) { try { return localStorage.getItem('trasp_' + k); } catch (e) { return null; } }
function borrar(k) { try { localStorage.removeItem('trasp_' + k); } catch (e) { } }
function horaAhora() { var d = new Date(); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
function nom(id) { return R.nom(S.A, id); }

/* ---------- Fechas para leer: "jue, 16 oct 26, 15:39" (en la hoja siguen como 2026-10-16 15:39) ---------- */
var DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
var MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
/** fh('2026-10-16', '15:39') · fh('2026-10-16 15:39') → "jue, 16 oct 26, 15:39" */
function fh(fecha, hora) {
  var s = String(fecha || '').trim(), m = s.match(/^(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2}))?/);
  var hm = String(hora || '').trim().match(/(\d{1,2}):(\d{2})/);
  if (!m) return s + (hora ? ' ' + hora : '');
  var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  var hh = hm ? hm[1] : m[4], mm = hm ? hm[2] : m[5];
  return DIAS[d.getDay()] + ', ' + m[3] + ' ' + MESES[d.getMonth()] + ' ' + m[1].slice(2) + (hh != null ? ', ' + ('0' + hh).slice(-2) + ':' + mm : '');
}
/* ---------- Personas para leer: en la página no salen correos; en su lugar, el área ---------- */
/** quien('jaraujo@fadermex.com', 'Oficinas · Logística') → 'Oficinas · Logística' */
function quien(txt, area) {
  var s = String(txt || ''), re = /[\w.+-]+@[\w-]+(?:\.[\w-]+)+/g;
  if (!re.test(s)) return s;
  var dentro = s.match(/\(([^)]*)\)/);                          // "correo (Oficinas · Logística)"
  s = s.replace(re, '').replace(/\([^)]*\)/, '').replace(/^[\s·]+|[\s·]+$/g, '').replace(/\s*·\s*·\s*/g, ' · ');
  return s || (dentro ? dentro[1] : '') || area || '';
}
function me() { return S.ctx ? S.ctx.area : ''; }
function esVistaAdmin() { return me() === 'ADMIN'; }
/** Oficinas trabaja con la cuenta abierta (sin credencial). Sucursales sí escanean credencial. */
function sinCred() { var a = S.A[me()]; return !!a && a.tipo === 'OFICINAS'; }
function wizNuevo() { return sinCred() ? { step: 2, persona: { nombre: S.ctx.email }, ident: {} } : { step: 1 }; }
function quienTxt(q) { return q.tipo === 'GESTOR' ? 'Gestor' : (q.areaNombre || 'Persona registrada'); }

function toast(msg) {
  $('#toast').innerHTML = '<div class="toast" role="status">' + esc(msg) + '</div>';
  clearTimeout(toast.t); toast.t = setTimeout(function () { $('#toast').innerHTML = ''; }, 3200);
}
/*
 * SONIDOS OFICIALES (aprobados 20 oct; no cambiar sin preguntar). Todos son de campana:
 *   ok     escaneo correcto o credencial reconocida   · dos notas rápidas que suben      (1C)
 *   listo  se guardó (confirmar, crear, recolección)    · dos campanas en quinta que suben (2A)
 *   warn   ojo: ya estaba en la lista, se saltó un paso · dos toques iguales               (3B)
 *   err    error: no se puede                          · tres campanas que bajan          (4C)
 *   aviso  llegó una notificación nueva                  · campanita de tres notas
 * Cada nota: [frecuencia, inicio (s), duración (s), volumen]
 */
var CAMPANA = [[1, 1], [2.76, .22], [5.4, .06]];
var AC = null, SONIDOS = {
  ok: { nombre: 'Escaneo correcto', notas: [[1568, 0, .12, .13], [2093, .06, .3, .15]] },
  listo: { nombre: 'Guardado / confirmado', notas: [[1046.5, 0, .5, .14], [1568, .14, .8, .14]] },
  warn: { nombre: 'Ojo (aviso)', notas: [[784, 0, .3, .13], [784, .22, .45, .13]] },
  err: { nombre: 'Error', notas: [[440, 0, .25, .15], [349.2, .15, .25, .15], [293.7, .3, .6, .16]] },
  aviso: { nombre: 'Notificación nueva', notas: [[784, 0, .5, .1], [1046.5, .12, .5, .1], [1318.5, .24, .8, .1]], parciales: [[1, 1], [2.76, .22]], corto: .45 }
};
function beep(k) {
  try {
    var snd = SONIDOS[k] || SONIDOS.ok;
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    var suave = AC.createBiquadFilter(); suave.type = 'lowpass'; suave.frequency.value = 3900; suave.connect(AC.destination);
    var t0 = AC.currentTime + .01;
    snd.notas.forEach(function (n) {
      // Nota principal + armónicos tenues de campana (los agudos se apagan antes)
      (snd.parciales || CAMPANA).forEach(function (p) {
        var o = AC.createOscillator(), g = AC.createGain(), ini = t0 + n[1], dur = n[2] * (p[0] === 1 ? 1 : (snd.corto || .5));
        o.type = 'sine';
        o.frequency.value = n[0] * p[0];
        g.gain.setValueAtTime(0, ini);
        g.gain.linearRampToValueAtTime(n[3] * p[1], ini + .007);
        g.gain.exponentialRampToValueAtTime(.0001, ini + dur);
        o.connect(g); g.connect(suave); o.start(ini); o.stop(ini + dur + .02);
      });
    });
  } catch (e) { }
}

/** Llama al servidor (Apps Script). */
function srv(fn) {
  var args = [].slice.call(arguments, 1);
  return new Promise(function (res, rej) {
    google.script.run
      .withSuccessHandler(function (r) {
        if (r && r.ok === false) {
          if (r.error === 'SESION_EXPIRADA') { cerrarSesion('Tu sesión terminó. Vuelve a entrar.'); }
          if (/^AREA_NO_EXISTE:/.test(r.error)) {
            var vieja = r.error.split(':')[1];
            cerrarSesion('Esta computadora estaba en el área "' + vieja + '", que ya no existe (probablemente cambió su prefijo en CAT_Areas). Elige tu área otra vez.');
            r.error = 'Elige tu área otra vez.';
          }
          rej(new Error(r.error));
        } else res(r ? r.datos : null);
      })
      .withFailureHandler(function (e) { rej(e instanceof Error ? e : new Error(String(e))); })[fn].apply(null, args);
  });
}

/* ---------- entrada y sesión ---------- */
function arrancar() {
  // URL terminada en /SALIR (ej. Recepción en modo kiosco): olvida el área de esta computadora.
  if (window.SALIR) { borrar('token'); return pantallaEntrada('Saliste del área. Elige el área de esta computadora.'); }
  seguir();
}
function seguir() {
  var tk = leer('token');
  if (!tk) return pantallaEntrada();
  srv('apiReanudar', tk).then(function (d) { S.token = tk; aplicarSesion(d.ctx, d.cat); })
    .catch(function (e) { if (/Elige tu área otra vez/.test(e.message)) return; borrar('token'); pantallaEntrada(); });
}

function pantallaEntrada(msg, pinPara) {
  pararPoll();
  S.token = null; S.ctx = null;
  $('#hdr').hidden = true; $('#adminbar').innerHTML = ''; $('#modal').innerHTML = '';
  $('#view').innerHTML = '<div class="cargando">Revisando tu cuenta…</div>';
  srv('apiInicio').then(function (d) { S.inicio = d; dibujarEntrada(msg, pinPara); })
    .catch(function (e) {
      $('#view').innerHTML = '<div class="entrada"><h1>Traspasos</h1><div class="feedback err">' + esc(e.message) + '</div></div>';
    });
}

function dibujarEntrada(msg, pinPara) {
  var d = S.inicio;
  var porSuc = {};
  d.areas.forEach(function (a) { (porSuc[a.suc] = porSuc[a.suc] || []).push(a); });
  var nomPin = pinPara === 'ADMIN' ? 'Modo administrador' : ((d.areas.filter(function (a) { return a.id === pinPara; })[0] || {}).nombre || pinPara);
  var html = '<div class="entrada">' +
    (msg ? '<div class="feedback warn">' + esc(msg) + '</div>' : '') +
    (pinPara ? '<div class="panel stack pinbox"><b style="font-size:17px">🔑 PIN para entrar a ' + esc(nomPin) + '</b>' +
      '<div class="row"><input class="t" id="pinin" type="password" autocomplete="off" placeholder="PIN" style="max-width:220px">' +
      '<button class="btn primary" type="button" data-a="entrarpin" data-v="' + esc(pinPara) + '">Entrar</button>' +
      '<button class="btn ghost" type="button" data-a="pincancel">Cancelar</button></div></div>' : '') +
    '<div><h1>Traspasos</h1><p class="sub">Hola <b>' + esc(d.email) + '</b>. Elige el área de <b>esta computadora</b>. ' +
    'La app la recordará.</p></div>';
  if (d.admin) html += '<div class="grupo"><h2>Administración</h2><div class="areas"><button class="adm" data-a="entrar" data-v="ADMIN">' + (d.adminPin ? '🔑 ' : '') + 'Entrar como administrador</button></div><p class="muted" style="margin:0;font-size:13.5px">Para el día a día entra como tu área. Cuando necesites arreglar algo, usa el botón dorado "Modo administrador" de arriba.</p></div>';
  Object.keys(porSuc).forEach(function (s) {
    html += '<div class="grupo"><h2>' + esc(s) + '</h2><div class="areas">' +
      porSuc[s].map(function (a) {
        return a.mia
          ? '<button data-a="entrar" data-v="' + esc(a.id) + '">' + (a.pin ? '🔑 ' : '') + esc(a.nombre) + '<div class="muted" style="font-size:12.5px;font-weight:700">' + (a.pin ? 'Pide PIN · ' : '') + 'Folios ' + esc(a.id) + '-0001</div></button>'
          : '<button class="bloq" disabled title="Esta cuenta no tiene acceso a esta área">🔒 ' + esc(a.nombre) + '<div style="font-size:12.5px;font-weight:700">Sin acceso con esta cuenta</div></button>';
      }).join('') +
      '</div></div>';
  });
  $('#view').innerHTML = html + '</div>';
  if ($('#pinin')) $('#pinin').focus();
}

function entrar(area, pin) {
  if (area !== 'ADMIN') guardar('ultimaArea', area);
  $('#view').innerHTML = '<div class="cargando">Entrando…</div>';
  srv('apiEntrar', area, navigator.userAgent, pin || '').then(function (d) {
    guardar('token', d.token); S.token = d.token; aplicarSesion(d.ctx, d.cat);
  }).catch(function (e) {
    if (e.message === 'PIN_REQUERIDO') return S.inicio && !S.ctx ? dibujarEntrada('', area) : pantallaEntrada('', area);
    if (S.inicio && !S.ctx) return dibujarEntrada(e.message, pin ? area : null);
    pantallaEntrada(e.message);
  });
}

function aplicarSesion(ctx, cat) {
  S.ctx = ctx; S.cat = cat; S.A = {}; S.E = {}; S.EC = {};
  cat.areas.forEach(function (a) { S.A[a.id] = a; });
  cat.estatus.forEach(function (e) { S.E[e.clave] = e.nombre; S.EC[e.clave] = e; });
  var css = cat.estatus.map(function (e) { return '.b-' + e.clave + '{color:' + e.color + ';background:' + e.fondo + '}'; }).join('');
  var st = document.getElementById('est-css') || document.head.appendChild(Object.assign(document.createElement('style'), { id: 'est-css' }));
  st.textContent = css;
  // Si entró al modo administrador con solicitudes pendientes, abre directo en Solicitudes.
  S.tab = esVistaAdmin() ? (((S.data && S.data.solicitudes) || []).length ? 'sol' : 'todos') : (ctx.area === 'REC' ? 'dejar' : 'bandeja');
  S.rec = { quien: null, quienId: null, lote: [], fb: null, enviando: false };
  S.scan = { modo: 'RECIBIR', lote: [], fb: null, gestor: null, log: [], enviando: false };
  S.wiz = wizNuevo();
  $('#hdr').hidden = false;
  render();
  refrescar(true);
  iniciarPoll();
}

function cerrarSesion(msg) { borrar('token'); pantallaEntrada(msg); }
function salir() { var tk = S.token; borrar('token'); if (tk) srv('apiSalir', tk).catch(function () { }); pantallaEntrada(); }

/* ---------- datos ---------- */
var MAPA = {}, CAJAS = {};
function refrescar(inicial) {
  if (!S.token || S.ocupado) return Promise.resolve();
  return srv('apiDatos', S.token).then(function (d) {
    var antes = S.noVistos;
    S.data = d;
    MAPA = {}; CAJAS = {};
    d.activos.forEach(function (t) { MAPA[R.limpio(t.folio)] = t; });
    (d.cajas || []).forEach(function (c) { CAJAS[R.limpio(c.folio)] = c; });
    S.noVistos = d.avisos.filter(function (a) { return !a.visto; }).length;
    if (!inicial && S.noVistos > antes) {
      beep('aviso'); toast('🔔 ' + (d.avisos[0] ? d.avisos[0].folio + ' · ' + d.avisos[0].msg : 'Tienes avisos nuevos'));
      document.title = '(' + S.noVistos + ') Traspasos';
    }
    avisarSolicitudes(d.solicitudes || [], inicial);
    if (!S.noVistos && !(d.solicitudes || []).length) document.title = 'Traspasos';
    var ae = document.activeElement;
    if (!inicial && ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && ae.value) renderHeader();
    else render();
  }).catch(function (e) { if (inicial) toast(e.message); });
}
/** Administradores: suena y avisa cuando llega una solicitud nueva (cancelación o cambio de destino),
 *  aunque estén trabajando como su área. El número sale en el botón "Modo administrador". */
function avisarSolicitudes(sol, inicial) {
  if (!S.ctx.puedeAdmin || me() === 'REC') return;
  var antes = S.solIds || {}, nuevas = sol.filter(function (x) { return !antes[x.id]; });
  S.solIds = {}; sol.forEach(function (x) { S.solIds[x.id] = true; });
  if (sol.length) document.title = '(' + sol.length + ' solicitud' + (sol.length > 1 ? 'es' : '') + ') Traspasos';
  if (inicial) { if (sol.length && !esVistaAdmin()) toast('📋 Hay ' + sol.length + ' solicitud(es) esperando a un administrador'); return; }
  if (!nuevas.length) return;
  var x = nuevas[0];
  beep('aviso');
  toast('📋 Solicitud para administradores · ' + (x.tipo === 'DESTINO' ? 'cambio de destino' : 'cancelación') + ' de ' + x.folio + ' · ' + x.area + (nuevas.length > 1 ? ' (y ' + (nuevas.length - 1) + ' más)' : ''));
}
function iniciarPoll() {
  pararPoll();
  var seg = (S.cat && S.cat.ajustes.revisarSeg) || 45;
  S.timer = setInterval(function () {
    if (S.ctx && Date.now() > S.ctx.exp) return cerrarSesion('Tu sesión de 12 horas terminó. Vuelve a entrar.');
    refrescar(false);
  }, seg * 1000);
}
function pararPoll() { if (S.timer) { clearInterval(S.timer); S.timer = null; } }

/* ---------- pintado ---------- */
function badge(t) {
  var h = '<span class="badge b-' + esc(t.estatus) + '">' + esc(S.E[t.estatus] || t.estatus) + (t.estatus === 'UBICADO' && t.ubic ? ': ' + esc(nom(t.ubic)) : '') + '</span>';
  if (t.solicitud) h += ' <span class="badge b-ELIMINACION_SOLICITADA">Eliminación solicitada</span>';
  return h;
}
function areaTag(id) {
  var a = S.A[id];
  if (!a || (a.tipo !== 'SUCURSAL' && a.tipo !== 'FORANEA')) return '';
  var rb = /rebot/i.test(a.corto);
  return '<span class="atag ' + (rb ? 'rb' : 'pv') + '">PARA ' + esc(String(a.corto).toUpperCase()) + '</span>';
}
function colorDe(t) { return (S.EC[t.estatus] && S.EC[t.estatus].color) || '#5D6C7A'; }

function render() {
  if (!S.ctx) return;
  var adm = S.ctx.admin;
  $('#adminbar').innerHTML = adm ? '<div class="adminbar"><div class="wrap"><strong>MODO ADMINISTRADOR</strong><span>' + esc(S.ctx.email) + ' · control total: editar, mover, cambiar estatus y eliminar</span></div></div>' : '';
  renderHeader();
  var v = '';
  if (esVistaAdmin()) {
    v = S.tab === 'buscar' ? vBuscar() : S.tab === 'sol' ? vSolicitudes() : S.tab === 'hoja' ? vHoja() : vTodos();
  } else {
    v = me() === 'REC' ? vRecepcion()
      : S.tab === 'botican' ? vBotican() : S.tab === 'nuevo' ? vNuevo() : S.tab === 'escaner' ? vEscaner() : S.tab === 'paq' ? vPaqueteria() : vBandeja();
  }
  $('#view').innerHTML = v;
  pintarCodigos($('#view'));
  renderModal();
  var si = $('#scanin') || $('#crea-cod') || $('#gest-cod') || $('#recv-cod') || $('#rec-cod') || $('#recin') || $('#cajain') || $('#bgest-cod') || $('#botin');
  if (si && !S.modal && !S.bell) si.focus({ preventScroll: true });
}

/** Botón ❓ Ayuda: los manuales en PDF que le tocan a esta computadora (links en CFG_Ajustes). */
function manualesPara() {
  var M = (S.cat.ajustes && S.cat.ajustes.manuales) || {}, l = [];
  // La computadora de Recepción solo ve SU manual, aunque esté abierta con una cuenta de administrador.
  if (me() === 'REC') return [['📙', 'Manual de Recepción Oficinas', 'Cómo usar esta computadora del stand', M.rec]];
  var ofi = R.esOf(S.A, me());
  if (S.ctx.puedeAdmin || !ofi) l.push(['📗', 'Manual de Sucursales', 'PV, Rebotica, Botican y Morelia', M.suc]);
  if (S.ctx.puedeAdmin || ofi) l.push(['📘', 'Manual de Oficinas y Recepción', 'Áreas de Oficinas, Logística y Recepción', M.ofi]);
  if (S.ctx.puedeAdmin) {
    l.push(['📙', 'Manual de Recepción Oficinas', 'La computadora del stand', M.rec]);
    l.push(['📕', 'Manual de Administradores', 'Modo administrador, catálogos y operación', M.adm]);
    if (M.proc) l.push(['📄', 'Proceso implementado', 'Documento oficial del proceso', M.proc]);
  }
  return l;
}
function ayudaHTML() {
  var l = manualesPara(), M = (S.cat.ajustes && S.cat.ajustes.manuales) || {};
  return '<div class="bellwrap"><button type="button" class="bell ayuda" data-a="ayuda" aria-label="Ayuda" aria-expanded="' + !!S.ayuda + '">❓</button>' +
    (S.ayuda ? '<div class="bellpanel"><b>Ayuda · Manual de uso</b>' + l.map(function (x) {
      return x[3] ? '<a class="bellitem manual" href="' + esc(x[3]) + '" target="_blank" rel="noopener"><span style="font-size:22px">' + x[0] + '</span><span><b>' + esc(x[1]) + '</b><br><span class="muted" style="font-size:12.5px">' + esc(x[2]) + ' · abrir PDF</span></span></a>'
        : '<div class="bellitem manual" style="cursor:default;opacity:.6"><span style="font-size:22px">' + x[0] + '</span><span><b>' + esc(x[1]) + '</b><br><span class="muted" style="font-size:12.5px">Todavía no se carga. Avisa a Logística.</span></span></div>';
    }).join('') +
      (S.ctx.puedeAdmin && me() !== 'REC' && M.carpeta ? '<a class="btn ghost" style="justify-self:start;font-size:13px;padding:6px 10px" href="' + esc(M.carpeta) + '" target="_blank" rel="noopener">📁 Carpeta de manuales (actualizar)</a>' : '') +
      '<div class="muted" style="font-size:12px">Siempre se abre la versión más reciente.' + (me() === 'REC' ? ' Para regresar a la página, cierra el PDF con <b>Ctrl + W</b>.' : '') + '</div></div>' : '') + '</div>';
}
function renderHeader() {
  var tabs = [];
  if (esVistaAdmin()) {
    tabs = [['todos', 'Todos los traspasos'], ['buscar', 'Buscador'], ['sol', 'Solicitudes', S.data.solicitudes.length], ['hoja', 'Catálogos']];
  } else if (me() === 'REC') {
    var enRec = S.data.traspasos.filter(function (t) { return t.estatus === 'EN_RECEPCION' || R.porSalirRec(t, S.A); }).length;
    tabs = [['dejar', '📥 Dejar'], ['recoger', '📤 Recoger'], ['resguardo', 'En resguardo', enRec], ['imprimir', '🖨 Centro de Impresión', 0, 'destacado']];
  } else {
    tabs = [['bandeja', 'Mi bandeja'], ['nuevo', 'Nuevo traspaso'], ['escaner', 'Escáner']];
    if (me() === 'BOT') tabs.push(['botican', '📦 Recolección pedidos BOTICAN', S.bot && S.bot.lista ? S.bot.lista.filter(function (p) { return p.estado === 'ELABORADO'; }).length : 0, 'destacado']);
    if (me() === 'LOG' || R.esMor(S.A, me())) {
      var enCaja = {};
      (S.data.cajas || []).forEach(function (c) { if (c.estatus === 'ARMADA' || c.estatus === 'ENVIADA') c.traspasos.forEach(function (f) { enCaja[f] = true; }); });
      var n = me() === 'LOG'
        ? S.data.traspasos.filter(function (t) { return R.empacable(t, S.A) && !enCaja[R.limpio(t.folio)]; }).length
        : S.data.traspasos.filter(function (t) { return R.paqueteria(t, me(), S.A); }).length;
      tabs.push(['paq', 'Paquetería', n]);
    }
  }
  var min = Math.max(0, Math.floor((S.ctx.exp - Date.now()) / 60000));
  var hueco = '<span class="logo" title="Aquí va el logo (CFG_Ajustes → logo_empresa)">LOGO</span>';
  var logo = S.cat.ajustes.logo && /^(https?:|data:image)/i.test(S.cat.ajustes.logo)
    ? '<img class="logo-img" src="' + esc(S.cat.ajustes.logo) + '" alt="" onerror="this.nextSibling.hidden=false;this.remove()">' + hueco.replace('<span ', '<span hidden ') : hueco;

function tamEtiqueta() {

               : { w: S.cat.ajustes.etiquetaAncho, h: S.cat.ajustes.etiquetaAlto, arriba: 0, izq: 0, girar: false, formato: '' };
  if (!/^(MINI|CHICA|COMPLETA)$/.test(tm.formato)) tm.formato = tm.h < 30 ? 'MINI' : tm.h < 50 ? 'CHICA' : 'COMPLETA';
  return tm;

/** Estilo de tamaño: en pantalla se escala; al imprimir mide exacto (un poco menos que la hoja, para que no salte a otra página). */
function estiloTam(tm, pantalla) {
  if (pantalla) return 'width:100%;aspect-ratio:' + tm.w + '/' + tm.h + ';';

/** Etiqueta chica: el destino va del tamaño del folio (11 pt); si no cabe en una línea, baja de medio en medio punto hasta 7 pt. */

  });

}
function etiquetaHTML(t, b, rp, pantalla) {

    '<div><div class="k">DESTINO</div><div class="dest">' + esc(t.destino ? nom(t.destino) : '—') + '</div></div>' +
    '<div><div class="k">ORIGEN</div><div class="orig">' + esc(nom(t.origen)) + '</div></div>' +

/*
 * CÓDIGO DE BARRAS PARA IMPRESORA TÉRMICA (203 dpi: 1 punto = 0.125 mm)
 * - Cada barra mide un número EXACTO de puntos (nada de estirar el código al ancho de la etiqueta):
 *   así la impresora no redondea y todas las barras del mismo tipo salen iguales.
 * - Barras de 3 puntos (0.375 mm) si caben; si el folio es largo (ej. NR-RB-0001), de 2 puntos.
 * - Con barras de 3 puntos se imprimen 1 punto más delgadas: la tinta que se corre las deja del tamaño justo.
 * - Margen blanco de 2.5 mm a cada lado (sin él la pistola no sabe dónde empieza el código).
 * - Altura corta (7 mm en 50 × 20): menos tinta y menos calor.
 */
var PUNTO = 0.125;
function bcHTML(code, anchoMm, altoMm) {
  return '<div class="bcw"><svg class="bc" data-code="' + esc(code) + '" data-w="' + anchoMm + '" data-h="' + altoMm + '"></svg></div>';
}
function pintarCodigos(raiz) {
  if (!window.JsBarcode) return;
  raiz.querySelectorAll('svg.bc').forEach(function (s) {
    try {
      var o = {};
      JsBarcode(o, s.getAttribute('data-code'), { format: 'CODE128' });
      var bits = o.encodings.map(function (e) { return e.data; }).join('');
      var ancho = Number(s.getAttribute('data-w')) || 45, alto = Number(s.getAttribute('data-h')) || 7;
      var quiet = 2.5, puntos = 3;
      if (bits.length * puntos * PUNTO + 2 * quiet > ancho) puntos = 2;
      if (bits.length * puntos * PUNTO + 2 * quiet > ancho) quiet = 2;
      var mod = puntos * PUNTO, red = puntos >= 3 ? PUNTO : 0;
      var w = bits.length * mod + 2 * quiet, r = '';
      for (var i = 0; i < bits.length;) {
        if (bits[i] !== '1') { i++; continue; }
        var j = i; while (j < bits.length && bits[j] === '1') j++;
        r += '<rect x="' + (quiet + i * mod) + '" y="0" width="' + ((j - i) * mod - red) + '" height="' + alto + '"/>';
        i = j;
      }
      // Centrado, pero cayendo justo en un punto de la impresora
      var izq = Math.max(0, Math.floor((ancho - w) / 2 / PUNTO) * PUNTO);
      s.setAttribute('viewBox', '0 0 ' + w + ' ' + alto);
      s.setAttribute('width', w + 'mm'); s.setAttribute('height', alto + 'mm');
      s.setAttribute('shape-rendering', 'crispEdges');
      s.style.marginLeft = izq + 'mm';
      s.innerHTML = r;
    } catch (e) { }
  });
}
function imprimir(t, bultos, rp) {
  mandarImprimir(bultos.map(function (b) { return etiquetaHTML(t, b, rp || 0, false); }).join(''));
}

/** Horas desde que se creó el traspaso. */
function horasDesde(t) {
  var f = String(t.fecha || '').slice(0, 10), hh = String(t.hora || '').slice(-5);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(f)) { f = String(t.act || '').slice(0, 10); hh = String(t.act || '').slice(11, 16); }

  var h = (Date.now() - d.getTime()) / 3600000;
  return isNaN(h) ? 0 : h;
}

function hTxt(t) { var h = Math.floor(horasDesde(t)); return h < 1 ? 'menos de 1 h' : h + ' h'; }

      '<label class="f" style="flex:1;min-width:180px">Motivo<input class="t" id="amot" placeholder="Opcional" autocomplete="off"></label></div>' +
      '<div class="row"><button class="btn gold" type="button" data-a="asave" data-v="' + esc(t.folio) + '">Guardar cambios</button>' +
      (m.confirmDel ? '<span style="font-weight:800;color:var(--err)">¿Eliminar ' + esc(t.folio) + '?</span><button class="btn danger" type="button" data-a="adel" data-v="' + esc(t.folio) + '">Sí, eliminar</button><button class="btn ghost" type="button" data-a="adelno">No</button>'
        : '<button class="btn danger" type="button" data-a="adelask">Eliminar</button>') + '</div></div></div>';
  }
  return '<div class="row" style="justify-content:space-between;align-items:flex-start"><div><div class="num" style="font-size:28px">' + esc(t.folio) + '</div><div class="muted">' + esc(t.desc) + '</div></div><div class="row">' + badge(t) + areaTag(t.destino) + '<button class="btn ghost" type="button" data-a="cerrar" aria-label="Cerrar">✕</button></div></div>' +
    (m.err ? '<div class="feedback err" style="margin-top:10px">' + esc(m.err) + '</div>' : '') +
    '<dl class="dl">' + dl.map(function (x) { return '<div><dt>' + x[0] + '</dt><dd>' + esc(x[1]) + '</dd></div>'; }).join('') + '</dl>' +
    '<h2>Línea de tiempo</h2><ol class="timeline">' + (movs.length ? movs.map(function (e) {
      var c = (S.EC[e.nuevo] && S.EC[e.nuevo].color) || '#9AA7B3';
      return '<li style="--tl:' + c + '"><div class="when">' + esc(fh(e.fecha, e.hora)) + '</div><div class="what">' + esc(e.accion) + '</div><div class="detail">' + esc([quien(e.persona, ''), e.donde, e.medio, e.detalle].filter(function (x, i, arr) { return x && arr.indexOf(x) === i; }).join(' · ')) + '</div></li>';
    }).join('') : '<li>Sin movimientos.</li>') + '</ol>' +
    '<details style="margin:8px 0 4px"><summary style="cursor:pointer;font-weight:800">Ver etiquetas (' + t.bultos + ')</summary><div class="labels" style="margin-top:12px">' + rango(t.bultos).map(function (b) { return etiquetaHTML(t, b, t.reimp || 0, true); }).join('') + '</div></details>' + acc;
}

/* ---------- eventos ---------- */
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-a]'); if (!el) return;
  var a = el.getAttribute('data-a'), v = el.getAttribute('data-v');
  if (a === 'fondo' && e.target !== el) return;
  if (a === 'faltan') return;
  var w = S.wiz;
  switch (a) {
    case 'entrar': return entrar(v);
    case 'salir': e.preventDefault(); return salir();
    case 'cambiarArea': return pantallaEntrada();
    case 'tab':
      if (me() === 'REC' && S.tab !== v) S.rec = { quien: null, quienId: null, lote: [], fb: null, enviando: false };
      S.tab = v; S.filtro = null; S.bell = false;
      if (v === 'imprimir') { abrirCentroImpresion(); return; }
      if (v === 'botican') { abrirBotican(); return; }
      break;
    case 'impUno': return imprimirEnRecepcion([v]);
    case 'impTodas': return imprimirEnRecepcion(S.imp.lista.map(function (t) { return t.folio; }));
    case 'impRecargar': return abrirCentroImpresion();
    case 'entsug': case 'recsug': return alEscanear(v);
    case 'tclear': S.scan.trae = null; break;
    case 'botsel': botMarcar(v, !S.bot.sel[v]); break;
    case 'botcambiar': S.bot.gestor = null; S.bot.gestorId = null; S.bot.sel = {}; S.bot.fb = null; break;
    case 'botconf': return botConfirmar();
    case 'bototra': return abrirBotican();
    case 'botrecargar': return cargarBotican();
    case 'dir': S.dir = v; S.filtro = null; break;
    case 'filtro': S.filtro = S.filtro === v ? null : v; break;
    case 'ayuda': S.ayuda = !S.ayuda; S.bell = false; break;
    case 'bell':
      S.bell = !S.bell; S.sonidos = false; S.ayuda = false;
      // Solo se muestran los nuevos; al abrir se marcan vistos y ya no vuelven a salir.
      S.bellLista = S.bell ? (S.data.avisos || []).filter(function (x) { return !x.visto; }) : null;
      if (S.bell && S.noVistos) { srv('apiAvisosVistos', S.token).catch(function () { }); S.data.avisos.forEach(function (x) { x.visto = true; }); S.noVistos = 0; document.title = 'Traspasos'; }
      break;
    case 'sonidos': S.sonidos = !S.sonidos; break;
    case 'oir': beep(v); return;
    case 'open': return abrir(v);
    case 'cerrar': case 'fondo': S.modal = null; break;
    case 'form': S.modal.form = v || null; S.modal.err = null; S.modal.edesc = null; S.modal.ebul = null; S.modal.ndest = null; S.modal.nmot = null; break;

    case 'idman': return alIdentificar(v, leerId(v, true));
    case 'entrarpin': return entrar(v, $('#pinin').value);
    case 'pincancel': return leer('token') ? arrancar() : dibujarEntrada();
    case 'recquien': S.rec = { quien: null, quienId: null, lote: [], fb: null, enviando: false }; break;
    case 'recadd': return recEscanear(v);
    case 'recquitar': S.rec.lote = S.rec.lote.filter(function (t) { return t.folio !== v; }); break;
    case 'recconfirmar': return recConfirmar();
    case 'atras': w.step--; w.err = null; break;
    case 'dest': { var d = $('#destin').value; if (!d) { w.err = 'Elige el destino.'; break; } w.destino = d; w.bultos = w.bultos || 1; w.err = null; w.step = 3; break; }
    case 'sugdesc': {
      var actual = $('#descin').value.trim();
      if (actual.toLowerCase().indexOf(v.toLowerCase()) < 0) w.desc = actual ? actual + ', ' + v : v;
      else w.desc = actual;
      break;
    }
    case 'qty': w.desc = $('#descin').value; w.bultos = Math.min(99, Math.max(1, (w.bultos || 1) + Number(v))); break;
    case 'crear': return crear();
    case 'otro': S.wiz = wizNuevo(); break;
    case 'reimp-auto': if (w.t) imprimir(w.t, rango(w.t.bultos), 0); return;

    case 'modo': S.scan = { modo: v, lote: [], fb: null, gestor: null, log: [], enviando: false }; break;
    case 'gclear': S.scan.gestor = null; S.scan.lote = []; S.scan.fb = null; break;
    case 'rclear': S.scan.receptor = null; S.scan.receptorId = null; S.scan.fb = null; break;
    case 'vaciar': S.scan.lote = []; S.scan.fb = null; break;
    case 'confirmar': return confirmarLote();
    case 'ubicar':
      srv('apiUbicar', S.token, v).then(function () { toast('Registrado: ' + v + ' está en ' + nom(me())); S.scan.fb = { k: 'ok', m: 'Quedó registrado que ' + v + ' está aquí. Se avisó al origen, al destino y a administración.' }; refrescar(false); })
        .catch(function (er) { toast(er.message); });
      return;

    case 'cajaagregar': return agregarACaja(v);
    case 'cajaquitar': S.caja.lista = S.caja.lista.filter(function (t) { return t.folio !== v; }); S.caja.fb = null; break;
    case 'cajavaciar': S.caja = { lista: [], fb: null, enviando: false }; break;
    case 'cajacrear':
      S.caja.enviando = true; S.ocupado = true; render();
      srv('apiArmarCaja', S.token, S.caja.lista.map(function (t) { return t.folio; })).then(function (c) {
        S.caja = { lista: [], fb: { k: 'ok', m: 'Caja ' + c.folio + ' creada. Pégale su etiqueta y registra ' + c.folio + ' en Operaciones con su guía.' }, enviando: false };
        imprimirCaja(c); S.ocupado = false; refrescar(false);
      }).catch(function (er) { S.caja.enviando = false; S.ocupado = false; S.caja.fb = { k: 'err', m: er.message }; render(); });
      return;
    case 'cajaprint': { var c = CAJAS[R.limpio(v)]; if (c) imprimirCaja(c); return; }
    case 'cajadeshacer':
      srv('apiDeshacerCaja', S.token, v).then(function () { toast('Caja ' + v + ' deshecha; sus traspasos quedan sueltos'); refrescar(false); }).catch(function (er) { toast(er.message); });
      return;
    case 'sync':
      toast('Revisando Operaciones…');
      srv('apiSincronizar', S.token).then(function (d) {
        S.caja.fb = { k: d.omitidos.length ? 'warn' : 'ok', m: (d.actualizados ? d.actualizados + ' traspaso(s) pasaron a "Enviado por paquetería".' : 'Sin guías nuevas en Operaciones.') +
          (d.omitidos.length ? ' No se pudieron actualizar: ' + d.omitidos.map(function (o) { return o.folio + ' (' + o.motivo + ')'; }).join('; ') : '') };
        toast(d.actualizados ? d.actualizados + ' traspaso(s) actualizados' : 'Revisión terminada'); refrescar(false);
      }).catch(function (er) { toast(er.message); });
      return;
    case 'enviarpq': {
      var g = $('#gu-' + v).value.trim(); if (!g) { toast('Captura el número de guía'); return; }
      srv('apiPaqueteria', S.token, v, $('#pq-' + v).value, g).then(function () { toast(v + ' enviado por paquetería'); refrescar(false); }).catch(function (er) { toast(er.message); });
      return;
    }
    case 'rpgo': {
      var b = $('#rpb').value, mot = $('#rpm').value;
      srv('apiReimprimir', S.token, { folio: v, bulto: b, motivo: mot }).then(function (d) {
        S.modal.form = null; imprimir(d.traspaso, d.bultos, d.rp); abrir(v);
      }).catch(function (er) { S.modal.err = er.message; render(); });
      return;
    }
    case 'cancclear': S.modal.canc = null; S.modal.cancId = null; break;
    case 'edqclear': S.modal.edq = null; S.modal.edqId = null; break;
    case 'dsqclear': S.modal.dsq = null; S.modal.dsqId = null; break;
    case 'dsgo': {
      S.modal.ndest = $('#ndest').value; S.modal.nmot = $('#nmot').value.trim();
      if (!S.modal.ndest) { S.modal.err = 'Elige a dónde debe ir.'; break; }
      if (!S.modal.nmot) { S.modal.err = 'Escribe por qué se debe cambiar el destino.'; break; }
      if (!sinCred() && !S.modal.dsqId) { S.modal.err = 'Escanea tu credencial: queda registrado quién solicita el cambio.'; break; }
      srv('apiSolicitarCambioDestino', S.token, v, S.modal.ndest, S.modal.nmot, S.modal.dsqId || null).then(function () {
        beep('listo'); toast('Solicitud enviada a los administradores'); abrir(v); refrescar(false);
      }).catch(function (er) { S.modal.err = er.message; beep('err'); render(); });
      return;
    }
    case 'edgo': {
      S.modal.edesc = $('#edesc').value; S.modal.ebul = $('#ebul') ? $('#ebul').value : null;
      if (!S.modal.edesc.trim()) { S.modal.err = 'Escribe qué se envía.'; break; }
      if (!sinCred() && !S.modal.edqId) { S.modal.err = 'Escanea tu credencial: queda registrado quién editó.'; break; }
      srv('apiEditarContenido', S.token, { folio: v, desc: S.modal.edesc, bultos: S.modal.ebul, quien: S.modal.edqId || null }).then(function (r) {
        beep('listo');
        if (r.bultosCambio && r.origen === me()) {
          toast('Guardado. Imprimiendo las etiquetas nuevas…');
          srv('apiReimprimir', S.token, { folio: v, bulto: 0, motivo: 'Se editó el número de bultos' }).then(function (x) { imprimir(x.traspaso, x.bultos, x.rp); });
        } else toast(r.bultosCambio ? 'Guardado. Se avisó al área que lo creó para que reimprima las etiquetas.' : 'Cambios guardados');
        abrir(v); refrescar(false);
      }).catch(function (er) { S.modal.err = er.message; beep('err'); render(); });
      return;
    }
    case 'destgo':
      srv('apiAdminEditar', S.token, v, { destino: $('#ndest').value }, $('#nmot').value)
        .then(function () { toast('Destino cambiado'); abrir(v); refrescar(false); }).catch(function (er) { S.modal.err = er.message; render(); });
      return;
    case 'delgo': {
      var mt = $('#delm').value.trim(); S.modal.delm = mt;
      if (!mt) { S.modal.err = 'Escribe el motivo.'; break; }
      if (!sinCred() && !S.modal.cancId) { S.modal.err = 'Escanea tu credencial: queda registrado quién solicita la cancelación.'; break; }
      srv('apiSolicitarEliminacion', S.token, v, mt, S.modal.cancId || null).then(function () { toast('Solicitud enviada a los administradores'); S.modal = null; refrescar(false); })
        .catch(function (er) { S.modal.err = er.message; render(); });
      return;
    }
    case 'asave':
      srv('apiAdminEditar', S.token, v, { estatus: $('#aest').value, destino: $('#adest').value, ubic: $('#aubic').value }, $('#amot').value)
        .then(function () { toast('Cambios guardados'); abrir(v); refrescar(false); }).catch(function (er) { S.modal.err = er.message; render(); });
      return;
    case 'adelask': S.modal.confirmDel = true; break;
    case 'adelno': S.modal.confirmDel = false; break;
    case 'adel':
      srv('apiAdminEliminar', S.token, v, $('#amot') ? $('#amot').value : '').then(function () { toast(v + ' eliminado'); S.modal = null; refrescar(false); })
        .catch(function (er) { S.modal.err = er.message; render(); });
      return;
    case 'solsi': case 'solno':
      srv('apiAdminResolver', S.token, v, a === 'solsi', $('#cm-' + v).value).then(function () { toast(a === 'solsi' ? 'Solicitud aprobada' : 'Solicitud rechazada'); refrescar(false); })
        .catch(function (er) { toast(er.message); });
      return;
    default: return;
  }
  render();
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'destin') { $('#rutanote').innerHTML = rutaNota(me(), e.target.value); if ($('#sugpanel')) $('#sugpanel').innerHTML = guiaEnvios(e.target.value); }
  if (e.target.id === 'impArea') cargarPendientes(e.target.value);
  if (e.target.getAttribute('data-a') === 'faltan') {
    var f = e.target.getAttribute('data-v');
    S.scan.lote.forEach(function (it) { if (it.t.folio === f) it.faltan = e.target.checked; });
    render();
  }
  if (e.target.getAttribute('data-inc') === 'tipo') { guardarInc(e.target); render(); }
});
/** Lo que pasa cuando un campo "se envía" (Enter, o solo, al terminar de escanear). */
function procesarCampo(el) {
  var id = el.id, v = el.value;
  if (id === 'scanin') alEscanear(v);
  else if (id === 'cajain') agregarACaja(v);
  else if (id === 'recin') recEscanear(v);
  else if (id === 'botin') botEscanear(v);
  else if (id === 'pinin') entrar(S.pinPara || el.closest('.pinbox').querySelector('[data-a=entrarpin]').getAttribute('data-v'), v);
  else if (/-(cod|nip|usr)$/.test(id)) {
    var p = id.replace(/-(cod|nip|usr)$/, '');
    alIdentificar(p, leerId(p, !/-cod$/.test(id)));
  }
  else return false;
  return true;
}

/*
 * ESCÁNER SIN ENTER: la pistola "teclea" muy rápido (menos de ~40 ms entre letras).
 * Si detectamos esa ráfaga, al terminar se envía solo, sin Enter ni teclado.
 * Si alguien teclea a mano un folio completo que existe, también se envía solo al dejar de teclear.
 * Si la pistola además manda Enter, no se duplica.
 */
var AUTO = { el: null, t: null, ult: 0, rapidas: 0, lentas: 0 };
var CAMPOS_AUTO = /^(scanin|cajain|recin|botin|[a-z]+-cod)$/;
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && S.modal) { S.modal = null; render(); return; }
  var el = e.target;
  if (e.key === 'Enter') {
    if (!el.id) return;
    clearTimeout(AUTO.t); AUTO.el = null;
    if (procesarCampo(el)) e.preventDefault();
    return;
  }
  if (!CAMPOS_AUTO.test(el.id || '') || e.key.length !== 1) return;
  var ahora = Date.now();
  if (AUTO.el !== el || !el.value) { AUTO.el = el; AUTO.rapidas = 0; AUTO.lentas = 0; }
  else if (ahora - AUTO.ult < 45) AUTO.rapidas++; else AUTO.lentas++;
  AUTO.ult = ahora;
});
document.addEventListener('input', function (e) {
  var el = e.target;
  if (el.id === 'descin') { S.wiz.desc = el.value; return; }
  if (el.getAttribute && el.getAttribute('data-inc')) { guardarInc(el); return; }
  if (!CAMPOS_AUTO.test(el.id || '')) return;
  clearTimeout(AUTO.t);
  var v = String(el.value || '').trim();
  if (!v) return;
  var pistola = AUTO.el === el && AUTO.rapidas >= 3 && AUTO.rapidas > AUTO.lentas;
  var f = R.folioDe(v);
  var completo = el.id === 'botin' ? !!botPedido(v) : !/-cod$/.test(el.id) && (MAPA[f] || CAJAS[f]) && R.valido(v);
  if (!pistola && !completo) return;
  AUTO.t = setTimeout(function () {
    if (!document.body.contains(el) || String(el.value || '').trim() !== v) return;
    AUTO.el = null;
    procesarCampo(el);
  }, pistola ? 120 : 900);
});
document.addEventListener('submit', function (e) {
  if (e.target.getAttribute('data-form') !== 'buscar') return;
  e.preventDefault();
  S.q = $('#busq').value;
  var f = R.folioDe(S.q);
  if (R.valido(S.q)) return abrir(f);
  if (/^\s*#\s*\w+\s*$/.test(S.q)) return abrir(S.q.replace(/\s+/g, '').toUpperCase());
  render();
});

/* ---------- Identificarse: credencial, o usuario + NIP ---------- */
function idHTML(p, etiqueta, ph) {
  // El código de la credencial nunca se ve: el campo lo muestra como ●●●● y luego solo aparece el nombre.
  return '<label class="f">' + etiqueta + '<input class="scaninput cred" id="' + p + '-cod" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="' + esc(ph || 'Escanea la credencial') + '"></label>' +
    '<details class="sincred"' + (S.idAbierto === p ? ' open' : '') + '><summary>¿Sin credencial? Teclea usuario y NIP</summary>' +
    '<div class="row" style="margin-top:8px"><input class="t" id="' + p + '-usr" autocomplete="off" placeholder="Usuario o No. de empleado" style="flex:1;min-width:150px">' +
    '<input class="t" id="' + p + '-nip" type="password" autocomplete="off" placeholder="NIP" style="width:130px">' +
    '<button class="btn primary" type="button" data-a="idman" data-v="' + p + '">Continuar</button></div></details>';
}
function leerId(p, manual) {
  var g = function (sfx) { var el = $('#' + p + '-' + sfx); return el ? String(el.value || '').trim() : ''; };
  if (manual) { S.idAbierto = p; return { usuario: g('usr'), nip: g('nip') }; }
  return { codigo: g('cod') };
}
function alIdentificar(p, d) {
  if (!d.codigo && !(d.usuario && d.nip)) return;
  if (p === 'crea') validarCred(d);
  else if (p === 'gest') validarGestor(d);
  else if (p === 'recv') validarReceptor(d);
  else if (p === 'rec') identificarRec(d);
  else if (p === 'bgest') validarGestorBot(d);
  else if (p === 'rgest') validarTrae(d);
  else if (p === 'canc' || p === 'edq' || p === 'dsq') {
    // Guardar lo que ya escribieron antes de volver a pintar
    if (S.modal && $('#delm')) S.modal.delm = $('#delm').value;
    if (S.modal && $('#nmot')) { S.modal.nmot = $('#nmot').value; S.modal.ndest = $('#ndest').value; }
    if (S.modal && $('#edesc')) { S.modal.edesc = $('#edesc').value; S.modal.ebul = $('#ebul') ? $('#ebul').value : null; }
    srv('apiPersona', S.token, d).then(function (q) { if (!S.modal) return; S.modal[p] = q; S.modal[p + 'Id'] = d; S.modal.err = null; S.idAbierto = null; beep('ok'); render(); })
      .catch(function (e) { if (S.modal) { S.modal.err = e.message; beep('err'); render(); } });
  }
}
function validarCred(d) {
  srv('apiPersona', S.token, d).then(function (p) { S.wiz.persona = p; S.wiz.ident = d; S.wiz.err = null; S.wiz.step = 2; S.idAbierto = null; beep('ok'); render(); })
    .catch(function (e) { S.wiz.err = e.message; beep('err'); render(); });
}
function validarGestor(d) {
  srv('apiGestor', S.token, d).then(function (g) { S.scan.gestor = g; S.scan.gestorId = d; S.idAbierto = null; S.scan.fb = { k: 'ok', m: g.nombre + ' se los lleva. Ahora escanea los traspasos.' }; beep('ok'); render(); })
    .catch(function (e) { S.scan.fb = { k: 'err', m: e.message }; beep('err'); render(); });
}
function validarReceptor(d) {
  srv('apiPersona', S.token, d).then(function (q) { S.scan.receptor = q; S.scan.receptorId = d; S.idAbierto = null; S.scan.fb = { k: 'ok', m: 'Recibe ' + q.nombre + '. Ahora escanea los traspasos.' }; beep('ok'); render(); })
    .catch(function (e) { S.scan.fb = { k: 'err', m: e.message }; beep('err'); render(); });
}
function crear() {
  var w = S.wiz;
  w.desc = $('#descin').value.trim();
  if (!w.desc) { w.err = 'Describe qué envías.'; return render(); }
  w.enviando = true; w.err = null; render();
  var d = { destino: w.destino, desc: w.desc, bultos: w.bultos || 1 };
  var id = w.ident || {};
  if (id.codigo) d.codigo = id.codigo; else { d.usuario = id.usuario; d.nip = id.nip; }
  srv('apiCrear', S.token, d).then(function (t) {
    S.wiz = { step: 4, t: t };
    beep('listo'); render();
    imprimir(t, rango(t.bultos), 0);
    refrescar(false);
  }).catch(function (e) { w.enviando = false; w.err = e.message; render(); });
}

arrancar();
