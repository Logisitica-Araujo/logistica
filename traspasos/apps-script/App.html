<script>
/***********************************************************************
 * TRASPASOS FADERMEX — App.html (lo que corre en la computadora)
 ***********************************************************************/
var S = {
  token: null, ctx: null, cat: null, A: {}, E: {}, EC: {},
  data: { traspasos: [], activos: [], avisos: [], solicitudes: [] },
  tab: 'bandeja', dir: 'in', filtro: null,
  wiz: { step: 1 },
  scan: { modo: 'RECIBIR', lote: [], fb: null, gestor: null, log: [], enviando: false },
  modal: null, bell: false, q: '', timer: null, ocupado: false, noVistos: 0,
  caja: { lista: [], fb: null, enviando: false }
};

/* ---------- utilidades ---------- */
function $(s) { return document.querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function guardar(k, v) { try { localStorage.setItem('trasp_' + k, v); } catch (e) { } }
function leer(k) { try { return localStorage.getItem('trasp_' + k); } catch (e) { return null; } }
function borrar(k) { try { localStorage.removeItem('trasp_' + k); } catch (e) { } }
function horaAhora() { var d = new Date(); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
function nom(id) { return R.nom(S.A, id); }
function me() { return S.ctx ? S.ctx.area : ''; }
function esVistaAdmin() { return me() === 'ADMIN'; }
/** Oficinas trabaja con la cuenta abierta (sin credencial). Sucursales sí escanean credencial. */
function sinCred() { var a = S.A[me()]; return !!a && a.tipo === 'OFICINAS'; }
function wizNuevo() { return sinCred() ? { step: 2, persona: { nombre: S.ctx.email }, ident: {} } : { step: 1 }; }
function quienTxt(q) { return q.tipo === 'GESTOR' ? 'Gestor' : (q.areaNombre || 'Persona registrada'); }

function toast(msg) {
  $('#toast').innerHTML = '<div class="toast" role="status">' + esc(msg) + '</div>';
  clearTimeout(toast.t); toast.t = setTimeout(function () { $('#toast').innerHTML = ''; }, 3200);
}
var AC = null;
function beep(k) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = k === 'ok' ? 'sine' : 'square';
    o.frequency.value = k === 'ok' ? 1320 : k === 'warn' ? 620 : 220;
    g.gain.value = .06; o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + (k === 'ok' ? .09 : .28));
  } catch (e) { }
}

/** Llama al servidor (Apps Script). */
function srv(fn) {
  var args = [].slice.call(arguments, 1);
  return new Promise(function (res, rej) {
    google.script.run
      .withSuccessHandler(function (r) {
        if (r && r.ok === false) {
          if (r.error === 'SESION_EXPIRADA') { cerrarSesion('Tu sesión terminó. Vuelve a entrar.'); }
          rej(new Error(r.error));
        } else res(r ? r.datos : null);
      })
      .withFailureHandler(function (e) { rej(e instanceof Error ? e : new Error(String(e))); })[fn].apply(null, args);
  });
}

/* ---------- entrada y sesión ---------- */
function arrancar() {
  // URL terminada en /SALIR (ej. Recepción en modo kiosco): olvida el área de esta computadora.
  if (window.SALIR) { borrar('token'); return pantallaEntrada('Saliste del área. Elige el área de esta computadora.'); }
  seguir();
}
function seguir() {
  var tk = leer('token');
  if (!tk) return pantallaEntrada();
  srv('apiReanudar', tk).then(function (d) { S.token = tk; aplicarSesion(d.ctx, d.cat); })
    .catch(function () { borrar('token'); pantallaEntrada(); });
}

function pantallaEntrada(msg, pinPara) {
  pararPoll();
  S.token = null; S.ctx = null;
  $('#hdr').hidden = true; $('#adminbar').innerHTML = ''; $('#modal').innerHTML = '';
  $('#view').innerHTML = '<div class="cargando">Revisando tu cuenta…</div>';
  srv('apiInicio').then(function (d) { S.inicio = d; dibujarEntrada(msg, pinPara); })
    .catch(function (e) {
      $('#view').innerHTML = '<div class="entrada"><h1>Traspasos</h1><div class="feedback err">' + esc(e.message) + '</div></div>';
    });
}

function dibujarEntrada(msg, pinPara) {
  var d = S.inicio;
  var porSuc = {};
  d.areas.forEach(function (a) { (porSuc[a.suc] = porSuc[a.suc] || []).push(a); });
  var nomPin = pinPara === 'ADMIN' ? 'Modo administrador' : ((d.areas.filter(function (a) { return a.id === pinPara; })[0] || {}).nombre || pinPara);
  var html = '<div class="entrada">' +
    (msg ? '<div class="feedback warn">' + esc(msg) + '</div>' : '') +
    (pinPara ? '<div class="panel stack pinbox"><b style="font-size:17px">🔑 PIN para entrar a ' + esc(nomPin) + '</b>' +
      '<div class="row"><input class="t" id="pinin" type="password" autocomplete="off" placeholder="PIN" style="max-width:220px">' +
      '<button class="btn primary" type="button" data-a="entrarpin" data-v="' + esc(pinPara) + '">Entrar</button>' +
      '<button class="btn ghost" type="button" data-a="pincancel">Cancelar</button></div></div>' : '') +
    '<div><h1>Traspasos</h1><p class="sub">Hola <b>' + esc(d.email) + '</b>. Elige el área de <b>esta computadora</b>. ' +
    'La app la recordará.</p></div>';
  if (d.admin) html += '<div class="grupo"><h2>Administración</h2><div class="areas"><button class="adm" data-a="entrar" data-v="ADMIN">' + (d.adminPin ? '🔑 ' : '') + 'Entrar como administrador</button></div><p class="muted" style="margin:0;font-size:13.5px">Para el día a día entra como tu área. Cuando necesites arreglar algo, usa el botón dorado "Modo administrador" de arriba.</p></div>';
  Object.keys(porSuc).forEach(function (s) {
    html += '<div class="grupo"><h2>' + esc(s) + '</h2><div class="areas">' +
      porSuc[s].map(function (a) {
        return a.mia
          ? '<button data-a="entrar" data-v="' + esc(a.id) + '">' + (a.pin ? '🔑 ' : '') + esc(a.nombre) + '<div class="muted" style="font-size:12.5px;font-weight:700">' + (a.pin ? 'Pide PIN · ' : '') + 'Folios ' + esc(a.id) + '-0001</div></button>'
          : '<button class="bloq" disabled title="Esta cuenta no tiene acceso a esta área">🔒 ' + esc(a.nombre) + '<div style="font-size:12.5px;font-weight:700">Sin acceso con esta cuenta</div></button>';
      }).join('') +
      '</div></div>';
  });
  $('#view').innerHTML = html + '</div>';
  if ($('#pinin')) $('#pinin').focus();
}

function entrar(area, pin) {
  if (area !== 'ADMIN') guardar('ultimaArea', area);
  $('#view').innerHTML = '<div class="cargando">Entrando…</div>';
  srv('apiEntrar', area, navigator.userAgent, pin || '').then(function (d) {
    guardar('token', d.token); S.token = d.token; aplicarSesion(d.ctx, d.cat);
  }).catch(function (e) {
    if (e.message === 'PIN_REQUERIDO') return S.inicio && !S.ctx ? dibujarEntrada('', area) : pantallaEntrada('', area);
    if (S.inicio && !S.ctx) return dibujarEntrada(e.message, pin ? area : null);
    pantallaEntrada(e.message);
  });
}

function aplicarSesion(ctx, cat) {
  S.ctx = ctx; S.cat = cat; S.A = {}; S.E = {}; S.EC = {};
  cat.areas.forEach(function (a) { S.A[a.id] = a; });
  cat.estatus.forEach(function (e) { S.E[e.clave] = e.nombre; S.EC[e.clave] = e; });
  var css = cat.estatus.map(function (e) { return '.b-' + e.clave + '{color:' + e.color + ';background:' + e.fondo + '}'; }).join('');
  var st = document.getElementById('est-css') || document.head.appendChild(Object.assign(document.createElement('style'), { id: 'est-css' }));
  st.textContent = css;
  S.tab = esVistaAdmin() ? 'todos' : (ctx.area === 'REC' ? 'dejar' : 'bandeja');
  S.rec = { quien: null, quienId: null, lote: [], fb: null, enviando: false };
  S.scan = { modo: 'RECIBIR', lote: [], fb: null, gestor: null, log: [], enviando: false };
  S.wiz = wizNuevo();
  $('#hdr').hidden = false;
  render();
  refrescar(true);
  iniciarPoll();
}

function cerrarSesion(msg) { borrar('token'); pantallaEntrada(msg); }
function salir() { var tk = S.token; borrar('token'); if (tk) srv('apiSalir', tk).catch(function () { }); pantallaEntrada(); }

/* ---------- datos ---------- */
var MAPA = {}, CAJAS = {};
function refrescar(inicial) {
  if (!S.token || S.ocupado) return Promise.resolve();
  return srv('apiDatos', S.token).then(function (d) {
    var antes = S.noVistos;
    S.data = d;
    MAPA = {}; CAJAS = {};
    d.activos.forEach(function (t) { MAPA[R.limpio(t.folio)] = t; });
    (d.cajas || []).forEach(function (c) { CAJAS[R.limpio(c.folio)] = c; });
    S.noVistos = d.avisos.filter(function (a) { return !a.visto; }).length;
    if (!inicial && S.noVistos > antes) {
      beep('ok'); toast('🔔 ' + (d.avisos[0] ? d.avisos[0].folio + ' · ' + d.avisos[0].msg : 'Tienes avisos nuevos'));
      document.title = '(' + S.noVistos + ') Traspasos';
    }
    if (!S.noVistos) document.title = 'Traspasos';
    var ae = document.activeElement;
    if (!inicial && ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && ae.value) renderHeader();
    else render();
  }).catch(function (e) { if (inicial) toast(e.message); });
}
function iniciarPoll() {
  pararPoll();
  var seg = (S.cat && S.cat.ajustes.revisarSeg) || 45;
  S.timer = setInterval(function () {
    if (S.ctx && Date.now() > S.ctx.exp) return cerrarSesion('Tu sesión de 12 horas terminó. Vuelve a entrar.');
    refrescar(false);
  }, seg * 1000);
}
function pararPoll() { if (S.timer) { clearInterval(S.timer); S.timer = null; } }

/* ---------- pintado ---------- */
function badge(t) {
  var h = '<span class="badge b-' + esc(t.estatus) + '">' + esc(S.E[t.estatus] || t.estatus) + (t.estatus === 'UBICADO' && t.ubic ? ': ' + esc(nom(t.ubic)) : '') + '</span>';
  if (t.solicitud) h += ' <span class="badge b-ELIMINACION_SOLICITADA">Eliminación solicitada</span>';
  return h;
}
function areaTag(id) {
  var a = S.A[id];
  if (!a || (a.tipo !== 'SUCURSAL' && a.tipo !== 'FORANEA')) return '';
  var rb = /rebot/i.test(a.corto);
  return '<span class="atag ' + (rb ? 'rb' : 'pv') + '">PARA ' + esc(String(a.corto).toUpperCase()) + '</span>';
}
function colorDe(t) { return (S.EC[t.estatus] && S.EC[t.estatus].color) || '#5D6C7A'; }

function render() {
  if (!S.ctx) return;
  var adm = S.ctx.admin;
  $('#adminbar').innerHTML = adm ? '<div class="adminbar"><div class="wrap"><strong>MODO ADMINISTRADOR</strong><span>' + esc(S.ctx.email) + ' · control total: editar, mover, cambiar estatus y eliminar</span></div></div>' : '';
  renderHeader();
  var v = '';
  if (esVistaAdmin()) {
    v = S.tab === 'buscar' ? vBuscar() : S.tab === 'sol' ? vSolicitudes() : S.tab === 'hoja' ? vHoja() : vTodos();
  } else {
    v = me() === 'REC' ? vRecepcion()
      : S.tab === 'nuevo' ? vNuevo() : S.tab === 'escaner' ? vEscaner() : S.tab === 'paq' ? vPaqueteria() : vBandeja();
  }
  $('#view').innerHTML = v;
  pintarCodigos($('#view'));
  renderModal();
  var si = $('#scanin') || $('#crea-cod') || $('#gest-cod') || $('#recv-cod') || $('#rec-cod') || $('#recin') || $('#cajain');
  if (si && !S.modal && !S.bell) si.focus({ preventScroll: true });
}

function renderHeader() {
  var tabs = [];
  if (esVistaAdmin()) {
    tabs = [['todos', 'Todos los traspasos'], ['buscar', 'Buscador'], ['sol', 'Solicitudes', S.data.solicitudes.length], ['hoja', 'Catálogos']];
  } else if (me() === 'REC') {
    var enRec = S.data.traspasos.filter(function (t) { return t.estatus === 'EN_RECEPCION'; }).length;
    tabs = [['dejar', '📥 Dejar'], ['recoger', '📤 Recoger'], ['resguardo', 'En resguardo', enRec], ['imprimir', '🖨 Centro de Impresión', 0, 'destacado']];
  } else {
    tabs = [['bandeja', 'Mi bandeja'], ['nuevo', 'Nuevo traspaso'], ['escaner', 'Escáner']];
    if (me() === 'LOG' || R.esMor(S.A, me())) {
      var enCaja = {};
      (S.data.cajas || []).forEach(function (c) { if (c.estatus === 'ARMADA' || c.estatus === 'ENVIADA') c.traspasos.forEach(function (f) { enCaja[f] = true; }); });
      var n = me() === 'LOG'
        ? S.data.traspasos.filter(function (t) { return R.empacable(t, S.A) && !enCaja[R.limpio(t.folio)]; }).length
        : S.data.traspasos.filter(function (t) { return R.paqueteria(t, me(), S.A); }).length;
      tabs.push(['paq', 'Paquetería', n]);
    }
  }
  var min = Math.max(0, Math.floor((S.ctx.exp - Date.now()) / 60000));
  var hueco = '<span class="logo" title="Aquí va el logo (CFG_Ajustes → logo_empresa)">LOGO</span>';
  var logo = S.cat.ajustes.logo && /^(https?:|data:image)/i.test(S.cat.ajustes.logo)
    ? '<img class="logo-img" src="' + esc(S.cat.ajustes.logo) + '" alt="" onerror="this.nextSibling.hidden=false;this.remove()">' + hueco.replace('<span ', '<span hidden ') : hueco;
  var avisos = S.data.avisos || [];
  var bell = '<div class="bellwrap"><button type="button" class="bell" data-a="bell" aria-label="Avisos">🔔' + (S.noVistos ? '<span class="count">' + S.noVistos + '</span>' : '') + '</button>' +
    (S.bell ? '<div class="bellpanel"><b>Avisos</b>' + (avisos.length ? avisos.map(function (a) {
      return '<button type="button" class="bellitem ' + (a.visto ? '' : 'unseen') + '" data-a="open" data-v="' + esc(a.folio) + '"><span class="num">' + esc(a.folio) + '</span><span>' + esc(a.msg) + '</span><span class="muted" style="font-size:12px">' + esc(a.fecha + ' ' + a.hora) + '</span></button>';
    }).join('') : '<div class="muted">Sin avisos.</div>') + '</div>' : '') + '</div>';
  $('#header').innerHTML = '<div class="brand">' + logo + 'Traspasos</div>' +
    cambioModo() + '<div class="who"><span class="p">' + esc(S.ctx.areaNombre) + '</span><span class="u">' + esc(S.ctx.email) + (min < 60 * 24 * 30 ? ' · sesión: cierra en ' + Math.floor(min / 60) + ' h ' + ('0' + (min % 60)).slice(-2) + ' min' : '') + (me() === 'REC' ? ' · 🔒 equipo fijo' : ' · <a href="#" data-a="salir">Salir</a>') + '</span></div>' +
    bell + '<nav class="tabs">' + tabs.map(function (x) {
      return '<button type="button" data-a="tab" data-v="' + x[0] + '"' + (x[3] ? ' class="' + x[3] + '"' : '') + (S.tab === x[0] ? ' aria-current="page"' : '') + '>' + x[1] + (x[2] ? ' <span class="count">' + x[2] + '</span>' : '') + '</button>';
    }).join('') + '</nav>';
}

/** Solo los administradores ven este botón: pasan de su área al modo administrador y de regreso. */
function cambioModo() {
  if (!S.ctx.puedeAdmin || me() === 'REC') return '';
  if (esVistaAdmin()) {
    var ult = leer('ultimaArea');
    return '<button class="btn" type="button" data-a="' + (ult ? 'entrar' : 'cambiarArea') + '" data-v="' + esc(ult || '') + '" title="Volver a trabajar como usuario">← ' + (ult && S.A[ult] ? 'Volver a ' + esc(nom(ult)) : 'Elegir mi área') + '</button>';
  }
  return '<button class="btn gold" type="button" data-a="entrar" data-v="ADMIN" title="Entrar al modo administrador">Modo administrador</button>';
}

function tcard(t, desdeOrigen) {
  var ruta = desdeOrigen ? '<span class="arrow">→</span>' + esc(nom(t.destino)) : esc(nom(t.origen)) + '<span class="arrow">→</span>' + esc(nom(t.destino));
  return '<button type="button" class="tcard" data-a="open" data-v="' + esc(t.folio) + '" style="color:' + colorDe(t) + '"><span class="stripe"></span>' +
    '<span class="body"><span class="top"><span class="folio">' + esc(t.folio) + '</span>' + badge(t) + areaTag(t.destino) + '</span>' +
    '<span class="route">' + ruta + '</span><span class="desc">' + esc(t.desc) + '</span></span>' +
    '<span class="side"><b>' + t.bultos + ' ' + (t.bultos > 1 ? 'bultos' : 'bulto') + '</b><span>' + esc(t.fecha + ' ' + t.hora) + '</span><span>' + esc(t.act ? 'Act. ' + t.act : '') + '</span></span></button>';
}
var ORD = { UBICADO: 0, EXTRAVIADO: 1, INCIDENCIA: 2, EN_RECEPCION: 3, ENTREGADO_GESTOR: 3, RECOLECTADO: 4, PAQUETERIA: 5, EN_LOGISTICA: 6, NUEVO: 7, ENTREGADO: 9 };
function orden(a, b) { var x = (a.solicitud ? -1 : (ORD[a.estatus] != null ? ORD[a.estatus] : 5)), y = (b.solicitud ? -1 : (ORD[b.estatus] != null ? ORD[b.estatus] : 5)); return x - y || String(b.act).localeCompare(String(a.act)); }

function chips(lista, accion, sel) {
  var c = {};
  lista.forEach(function (t) { c[t.estatus] = (c[t.estatus] || 0) + 1; });
  return '<div class="summary">' + S.cat.estatus.filter(function (e) { return c[e.clave]; }).map(function (e) {
    return '<button type="button" class="chip" data-a="' + accion + '" data-v="' + e.clave + '" aria-pressed="' + (sel === e.clave) + '"><span class="badge b-' + e.clave + '">' + esc(e.nombre) + '</span><span class="num">' + c[e.clave] + '</span></button>';
  }).join('') + '</div>';
}

/* ---------- Mi bandeja ---------- */
function vBandeja() {
  var m = me(), A = S.A;
  var ent = S.data.traspasos.filter(function (t) { return R.esEntrante(t, m, A) || (t.ubic === m && t.estatus === 'UBICADO'); });
  var sal = S.data.traspasos.filter(function (t) { return t.origen === m; });
  var src = S.dir === 'in' ? ent : sal;
  var lista = src.filter(function (t) { return !S.filtro || t.estatus === S.filtro; }).sort(orden);
  var a = A[m] || {};
  var nota = (a.tipo === 'SUCURSAL' || a.tipo === 'FORANEA')
    ? '<b>Entrantes</b>: todo lo que llega a ' + esc(a.sucNombre) + ' (PV y Rebotica). Cualquiera lo puede recibir; cada traspaso dice para quién es. <b>Salientes</b>: lo que sale de ' + esc(nom(m)) + '.'
    : 'Solo ves los traspasos que van para <b>' + esc(nom(m)) + '</b> o que salieron de aquí.';
  return '<h1>Mi bandeja</h1><p class="sub">' + nota + ' Para recibir o entregar usa el <b>Escáner</b>.</p>' +
    '<div class="seg"><button type="button" data-a="dir" data-v="in" aria-pressed="' + (S.dir === 'in') + '">Entrantes (' + ent.length + ')</button><button type="button" data-a="dir" data-v="out" aria-pressed="' + (S.dir === 'out') + '">Salientes (' + sal.length + ')</button></div>' +
    chips(src, 'filtro', S.filtro) +
    '<div class="list">' + (lista.length ? lista.map(function (t) { return tcard(t, S.dir === 'out'); }).join('') : '<div class="empty">No hay traspasos aquí.</div>') + '</div>';
}

/* ---------- Nuevo traspaso ---------- */
function vNuevo() {
  var w = S.wiz, m = me();
  var pasos = [sinCred() ? 'Tu cuenta' : 'Credencial', 'Destino', 'Contenido y bultos', 'Etiquetas'];
  var head = '<h1>Nuevo traspaso</h1><p class="sub">Sale de <b>' + esc(nom(m)) + '</b>. El folio y las etiquetas se generan solos al final.</p>' +
    '<div class="steps">' + pasos.map(function (p, i) { return '<div class="' + (w.step === i + 1 ? 'on' : w.step > i + 1 ? 'done' : '') + '">' + (i + 1) + '. ' + p + '</div>'; }).join('') + '</div>';
  var err = w.err ? '<div class="feedback err">' + esc(w.err) + '</div>' : '';
  if (w.step === 1) {
    return head + '<div class="grid2"><div class="panel stack">' +
      '<div class="scanbox"><b style="font-size:18px">Escanea tu credencial</b><span class="muted">Es obligatorio: queda registrado quién creó el traspaso.</span></div>' +
      idHTML('crea', 'Credencial', 'Escanea tu credencial') + err +
      '</div><div class="panel stack"><h2>¿No tienes credencial?</h2><p class="muted" style="margin:0">Abre <b>"¿Sin credencial?"</b> y teclea tu <b>usuario</b> (o número de empleado) y tu <b>NIP</b>. Si todavía no tienes, pídelos a un administrador.</p></div></div>';
  }
  if (w.step === 2) {
    var grupos = {};
    S.cat.areas.filter(function (a) { return a.activa && a.id !== m && !R.esPausa(a.id); }).forEach(function (a) { var g = a.tipo === 'OFICINAS' ? 'Oficinas' : (a.sucNombre || a.corto); (grupos[g] = grupos[g] || []).push(a); });
    var opts = Object.keys(grupos).map(function (g) { return '<optgroup label="' + esc(g) + '">' + grupos[g].map(function (a) { return '<option value="' + esc(a.id) + '"' + (w.destino === a.id ? ' selected' : '') + '>' + esc(a.nombre) + '</option>'; }).join('') + '</optgroup>'; }).join('');
    return head + '<div class="grid2"><div class="panel stack">' +
      '<div class="note">Creado por: <b>' + esc(w.persona.nombre) + '</b>' + (sinCred() ? ' · con la cuenta de Oficinas' : '') + '</div>' +
      '<label class="f">¿Para dónde va?<select class="t" id="destin"><option value="">Elige el destino…</option>' + opts + '</select></label>' +
      '<div id="rutanote">' + rutaNota(m, w.destino) + '</div>' +
      '<div class="row">' + (sinCred() ? '' : '<button class="btn ghost" type="button" data-a="atras">Atrás</button>') + '<button class="btn primary" type="button" data-a="dest">Continuar</button></div>' + err +
      '</div><div class="panel stack" id="sugpanel">' + guiaEnvios(w.destino) + '</div></div>';
  }
  if (w.step === 3) {
    return head + '<div class="grid2"><div class="panel stack">' +

/* ---------- Guía: qué se manda a cada área de Oficinas (hoja CAT_EnviosOf) ---------- */

function rutaNota(m, d) {

function rango(n) { var a = []; for (var i = 1; i <= n; i++) a.push(i); return a; }

/* ---------- Etiquetas ---------- */
/** Tamaño de etiqueta de ESTA computadora (CAT_Impresoras), o el general de CFG_Ajustes. */
function tamEtiqueta() {
  var imp = (S.cat.impresoras || {})[me()];
  var tm = imp ? { w: imp.ancho, h: imp.alto, arriba: imp.arriba || 0, izq: imp.izq || 0, girar: !!imp.girar, formato: imp.formato || '' }
               : { w: S.cat.ajustes.etiquetaAncho, h: S.cat.ajustes.etiquetaAlto, arriba: 0, izq: 0, girar: false, formato: '' };
  if (!/^(MINI|CHICA|COMPLETA)$/.test(tm.formato)) tm.formato = tm.h < 30 ? 'MINI' : tm.h < 50 ? 'CHICA' : 'COMPLETA';
  return tm;
}
/** Estilo de tamaño: en pantalla se escala; al imprimir mide exacto (un poco menos que la hoja, para que no salte a otra página). */
function estiloTam(tm, pantalla) {
  if (pantalla) return 'width:100%;aspect-ratio:' + tm.w + '/' + tm.h + ';';
  return 'width:' + (tm.w - 0.4) + 'mm;height:' + (tm.h - 0.6) + 'mm;' +
    (tm.arriba || tm.izq ? 'margin:' + tm.arriba + 'mm 0 0 ' + tm.izq + 'mm;' : '');
}
/** Manda a imprimir: una hoja por etiqueta, del tamaño exacto, sin hojas en blanco. */
function mandarImprimir(html) {
  var tm = tamEtiqueta(), p = $('#print');
  var pw = tm.girar ? tm.h : tm.w, ph = tm.girar ? tm.w : tm.h;
  p.innerHTML = '<style>@page{size:' + pw + 'mm ' + ph + 'mm;margin:0}' +
    (tm.girar ? '#print .lbl{transform:rotate(90deg) translateY(-100%);transform-origin:top left}' : '') + '</style>' + html;
  pintarCodigos(p);
  setTimeout(function () { window.print(); }, 200);
}
function etiquetaHTML(t, b, rp, pantalla) {
  var tm = tamEtiqueta();
  var tam = estiloTam(tm, pantalla);
  // Etiqueta MINI (menos de 30 mm de alto, ej. 50 × 20 mm de la Argox): folio, bulto, código y destino.
  if (tm.formato === 'MINI') {
    return '<div class="' + (pantalla ? 'label ' : '') + 'lbl mini" style="' + tam + '">' +
      '<div class="mrow"><span class="fol">' + esc(t.folio) + '</span><span class="bul">' + (rp ? 'R' + rp + ' · ' : '') + b + '/' + t.bultos + '</span></div>' +
      '<svg class="bc" data-code="' + esc(t.folio) + '"></svg>' +
      '<div class="dest">→ ' + esc(t.destino ? nom(t.destino) : '—') + '</div></div>';
  }
  var chica = tm.formato === 'CHICA' ? ' chica' : '';   // etiquetas chicas (ej. 62 × 29 mm): solo lo esencial
  return '<div class="' + (pantalla ? 'label ' : '') + 'lbl' + chica + '" style="' + tam + '">' + (rp ? '<span class="rp">R' + rp + '</span>' : '') +
    '<div><div class="k">DESTINO</div><div class="dest">' + esc(t.destino ? nom(t.destino) : '—') + '</div></div>' +
    '<div><div class="k">ORIGEN</div><div class="orig">' + esc(nom(t.origen)) + '</div></div>' +
    '<div class="fol">' + esc(t.folio) + '</div>' +
    '<svg class="bc" data-code="' + esc(t.folio) + '"></svg>' +
    '<div class="bul">BULTO ' + b + ' DE ' + t.bultos + '</div>' +
    '<div class="pie">' + esc((t.fecha || '') + ' ' + (t.hora || '')) + '<br>Creó: ' + esc(String(t.por || '').split(' · ')[0]) + '</div></div>';
}
function pintarCodigos(raiz) {
  if (!window.JsBarcode) return;
  raiz.querySelectorAll('svg.bc').forEach(function (s) {
    try { JsBarcode(s, s.getAttribute('data-code'), { format: 'CODE128', displayValue: false, height: 60, margin: 0, width: 2 }); s.setAttribute('preserveAspectRatio', 'none'); } catch (e) { }
  });
}
function imprimir(t, bultos, rp) {
  mandarImprimir(bultos.map(function (b) { return etiquetaHTML(t, b, rp || 0, false); }).join(''));

/* ---------- Escáner ---------- */
function vEscaner() {
  var sc = S.scan, m = me();
  var faltaG = sc.modo === 'ENTREGAR' && !sc.gestor;
  var faltaR = sc.modo === 'RECIBIR' && !sinCred() && !sc.receptor;   // sucursales: quién recibe

  var fb = sc.fb;
  var fbh = !fb ? '<div class="feedback idle">Escanea con la pistola: se agrega solo, sin Enter. Si lo tecleas, escribe el folio completo (ej. ' + esc(m) + '-0001).</div>'
    : '<div class="feedback ' + fb.k + '" role="alert"><span style="font-size:20px;line-height:1">' + ({ ok: '✓', err: '✕', warn: '!' })[fb.k] + '</span><span>' + esc(fb.m) +
      (fb.ubicable ? '<br><button class="btn" type="button" style="margin-top:8px" data-a="ubicar" data-v="' + esc(fb.folio) + '">Registrar que está aquí</button>' : '') + '</span></div>';
  var cola = sc.lote.length ? sc.lote.slice().reverse().map(function (it) {

    return '<div class="qrow"><span style="color:var(--ok);font-weight:900">✓</span><div style="min-width:0"><div class="row" style="gap:6px 10px">' + areaTag(t.destino) + '<span><span class="num">' + esc(t.folio) + '</span> · ' + esc(nom(t.origen)) + '<span class="arrow">→</span>' + esc(nom(t.destino)) + '</span></div>' +
      '<div class="muted" style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + t.bultos + ' bulto(s) · ' + esc(t.desc) + ' · creó ' + esc(String(t.por).split(' · ')[0]) + '</div></div>' +
      (sc.modo === 'RECIBIR' ? '<label><input type="checkbox" data-a="faltan" data-v="' + esc(t.folio) + '"' + (it.faltan ? ' checked' : '') + '> Faltan / dañado</label>' : '<span></span>') + '</div>';
  }).join('') : '<div class="empty">Aún no hay traspasos en la lista. Escanea el primero.</div>';
  var pill = function (q, que, accion) {
    return '<div class="gestorpill"><div><b>' + esc(q.nombre) + '</b><div class="muted" style="font-size:13px">' + que + ' · ' + esc(quienTxt(q)) + '</div></div><button class="btn ghost" type="button" data-a="' + accion + '" style="margin-left:auto">Cambiar</button></div>';
  };
  var ident = '';
  if (sc.modo === 'ENTREGAR') {
    ident = sc.gestor ? pill(sc.gestor, 'Se lo lleva', 'gclear')
      : '<div class="scanbox"><b>Primero escanea la credencial de quien se lo lleva</b><span class="muted">El gestor (o cualquier persona registrada) que transporta los paquetes.</span></div>' + idHTML('gest', 'Credencial', 'Escanea la credencial');
  } else if (!sinCred()) {
    ident = sc.receptor ? pill(sc.receptor, 'Recibe', 'rclear')
      : '<div class="scanbox"><b>Primero escanea TU credencial</b><span class="muted">Es obligatorio: queda registrado quién recibe.</span></div>' + idHTML('recv', 'Credencial de quien recibe', 'Escanea tu credencial');
  }
  return '<h1>Escáner en ráfaga</h1><p class="sub">Una sola pantalla para recibir y para entregar a gestoría. Cada folio se revisa al instante y se va formando la fila. Al final confirma.</p>' +
    '<div class="seg modos"><button type="button" class="m-rec" data-a="modo" data-v="RECIBIR" aria-pressed="' + (sc.modo === 'RECIBIR') + '">📥 Recibir traspasos</button><button type="button" class="m-ent" data-a="modo" data-v="ENTREGAR" aria-pressed="' + (sc.modo === 'ENTREGAR') + '">🛵 Entregar a gestor</button></div>' +
    '<div class="modoban ' + (sc.modo === 'RECIBIR' ? 'm-rec' : 'm-ent') + '">Estás en: <b>' + (sc.modo === 'RECIBIR' ? 'RECIBIR TRASPASOS' : 'ENTREGAR A GESTOR') + '</b></div>' +
    '<div class="scanner"><div class="stack">' + ident +
    (falta ? '' : '<label class="f">Folio<input class="scaninput" id="scanin" autocomplete="off" placeholder="' + esc(m) + '-0001"></label>') + fbh +
    '</div><div class="stack"><div class="row" style="justify-content:space-between"><h2 style="margin:0">' + (sc.modo === 'RECIBIR' ? 'Recibiendo' : 'Entregando a gestor') + ' · ' + sc.lote.length + '</h2>' +
    '<div class="row"><button class="btn ghost" type="button" data-a="vaciar"' + (sc.lote.length ? '' : ' disabled') + '>Vaciar</button><button class="btn primary" type="button" data-a="confirmar"' + (sc.lote.length && !sc.enviando ? '' : ' disabled') + '>' + (sc.enviando ? 'Guardando…' : 'Confirmar ' + (sc.modo === 'RECIBIR' ? 'recepción' : 'salida')) + '</button></div></div>' +
    '<div class="queue">' + cola + '</div></div></div>';
}
function alEscanear(texto) {
  texto = String(texto || '').trim();
  if (!texto) return;
  var sc = S.scan, m = me();
  var folio = R.folioDe(texto);
  if (CAJAS[folio] && sc.modo === 'RECIBIR') return escanearCaja(texto, CAJAS[folio]);
  var t = MAPA[folio];
  var v;
  if (!R.valido(texto) && !t) v = { k: 'err', m: '"' + texto + '" no parece un folio de traspaso. Revisa que esté bien tecleado.' };
  else v = sc.modo === 'RECIBIR' ? R.recibir(t, m, S.A, S.E) : R.salir(t, m, S.A, S.E, 'ENTREGAR');
  if (v.k === 'ok' && sc.lote.some(function (it) { return R.limpio(it.t.folio) === folio; })) v = { k: 'warn', m: t.folio + ' ya está en la lista.' };
  if (v.k === 'ok') {
    sc.lote.push({ t: t, faltan: false });
    v = { k: v.salto ? 'warn' : 'ok', m: t.folio + ' · ' + t.bultos + ' bulto(s) · ' + nom(t.origen) + ' → ' + nom(t.destino) +
      (v.salto ? ' · Agregado. Ojo: nadie registró la recolección; queda anotado.' : '') };
  }
  v.folio = t ? t.folio : folio;
  sc.fb = v;
  sc.log.push({ texto: texto, resultado: v.k === 'ok' ? 'OK' : v.k === 'warn' ? 'AVISO' : 'ERROR', mensaje: v.m, hora: horaAhora() });
  beep(v.k);
  render();
}
/** La etiqueta de una caja: se agregan todos los traspasos que trae. */
function escanearCaja(texto, cj) {
  var sc = S.scan, m = me(), agregados = 0, malos = [];
  cj.traspasos.forEach(function (f) {
    var t = MAPA[f];
    var v = R.recibir(t, m, S.A, S.E);
    if (v.k !== 'ok') { malos.push(f + ': ' + v.m); return; }
    if (sc.lote.some(function (it) { return R.limpio(it.t.folio) === f; })) return;
    sc.lote.push({ t: t, faltan: false, caja: cj.folio });
    agregados++;
  });
  var v2 = agregados
    ? { k: malos.length ? 'warn' : 'ok', m: 'Caja ' + cj.folio + ': ' + agregados + ' de ' + cj.traspasos.length + ' traspasos agregados.' + (malos.length ? ' No se agregaron: ' + malos.join(' · ') : '') }
    : { k: 'err', m: 'Caja ' + cj.folio + ': no se pudo agregar ningún traspaso. ' + malos.join(' · ') };
  sc.fb = v2;
  sc.log.push({ texto: texto, resultado: v2.k === 'ok' ? 'OK' : v2.k === 'warn' ? 'AVISO' : 'ERROR', mensaje: v2.m, hora: horaAhora() });
  beep(v2.k);
  render();
}

function confirmarLote() {
  var sc = S.scan;
  if (!sc.lote.length || sc.enviando) return;
  sc.enviando = true; S.ocupado = true; render();
  srv('apiConfirmarLote', S.token, {
    modo: sc.modo, gestor: sc.gestorId || null, receptor: sc.receptorId || null,
    items: sc.lote.map(function (it) { return { folio: it.t.folio, faltan: !!it.faltan, caja: it.caja || '' }; }),
    escaneos: sc.log
  }).then(function (d) {
    var ok = d.resultados.filter(function (r) { return r.ok; }).length;
    var mal = d.resultados.filter(function (r) { return !r.ok; });
    // Quien recibe se vuelve a escanear en cada recepción (así no se registra a otra persona por error).
    S.scan = { modo: sc.modo, lote: [], log: [], gestor: sc.gestor, gestorId: sc.gestorId, receptor: null, receptorId: null, enviando: false,
      fb: mal.length ? { k: 'warn', m: ok + ' guardado(s). No se guardaron: ' + mal.map(function (r) { return r.folio + ' (' + r.msg + ')'; }).join('; ') } : { k: 'ok', m: ok + ' traspaso(s) guardados.' } };
    toast(ok + ' traspaso(s) guardados');
    S.ocupado = false; refrescar(false);
  }).catch(function (e) { sc.enviando = false; S.ocupado = false; sc.fb = { k: 'err', m: e.message }; render(); });
}

/** Logística: armar cajas para Morelia. Las guías se jalan solas de "Operaciones". */

function cargarPendientes(area) {
  S.imp.area = area; S.imp.lista = null; S.imp.err = null;

/** Lo que pasa cuando un campo "se envía" (Enter, o solo, al terminar de escanear). */
function procesarCampo(el) {
  var id = el.id, v = el.value;
  if (id === 'scanin') alEscanear(v);
  else if (id === 'cajain') agregarACaja(v);
  else if (id === 'recin') recEscanear(v);
  else if (id === 'pinin') entrar(S.pinPara || el.closest('.pinbox').querySelector('[data-a=entrarpin]').getAttribute('data-v'), v);
  else if (/-(cod|nip|usr)$/.test(id)) {
    var p = id.replace(/-(cod|nip|usr)$/, '');
    alIdentificar(p, leerId(p, !/-cod$/.test(id)));
  }
  else return false;
  return true;
}

/*
 * ESCÁNER SIN ENTER: la pistola "teclea" muy rápido (menos de ~40 ms entre letras).
 * Si detectamos esa ráfaga, al terminar se envía solo, sin Enter ni teclado.
 * Si alguien teclea a mano un folio completo que existe, también se envía solo al dejar de teclear.
 * Si la pistola además manda Enter, no se duplica.
 */
var AUTO = { el: null, t: null, ult: 0, rapidas: 0, lentas: 0 };
var CAMPOS_AUTO = /^(scanin|cajain|recin|[a-z]+-cod)$/;
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && S.modal) { S.modal = null; render(); return; }
  var el = e.target;
  if (e.key === 'Enter') {
    if (!el.id) return;
    clearTimeout(AUTO.t); AUTO.el = null;
    if (procesarCampo(el)) e.preventDefault();
    return;
  }
  if (!CAMPOS_AUTO.test(el.id || '') || e.key.length !== 1) return;
  var ahora = Date.now();
  if (AUTO.el !== el || !el.value) { AUTO.el = el; AUTO.rapidas = 0; AUTO.lentas = 0; }
  else if (ahora - AUTO.ult < 45) AUTO.rapidas++; else AUTO.lentas++;
  AUTO.ult = ahora;
});
document.addEventListener('input', function (e) {
  var el = e.target;
  if (el.id === 'descin') { S.wiz.desc = el.value; return; }
  if (!CAMPOS_AUTO.test(el.id || '')) return;
  clearTimeout(AUTO.t);
  var v = String(el.value || '').trim();
  if (!v) return;
  var pistola = AUTO.el === el && AUTO.rapidas >= 3 && AUTO.rapidas > AUTO.lentas;
  var f = R.folioDe(v);
  var completo = !/-cod$/.test(el.id) && (MAPA[f] || CAJAS[f]) && R.valido(v);
  if (!pistola && !completo) return;
  AUTO.t = setTimeout(function () {
    if (!document.body.contains(el) || String(el.value || '').trim() !== v) return;
    AUTO.el = null;
    procesarCampo(el);
  }, pistola ? 120 : 900);
});
document.addEventListener('submit', function (e) {

  e.preventDefault();
  S.q = $('#busq').value;

  render();
});

function idHTML(p, etiqueta, ph) {

    '<input class="t" id="' + p + '-nip" type="password" autocomplete="off" placeholder="NIP" style="width:130px">' +
    '<button class="btn primary" type="button" data-a="idman" data-v="' + p + '">Continuar</button></div></details>';

function leerId(p, manual) {
  var g = function (sfx) { var el = $('#' + p + '-' + sfx); return el ? String(el.value || '').trim() : ''; };
  if (manual) { S.idAbierto = p; return { usuario: g('usr'), nip: g('nip') }; }
  return { codigo: g('cod') };
}
function alIdentificar(p, d) {
  if (!d.codigo && !(d.usuario && d.nip)) return;
  if (p === 'crea') validarCred(d);
  else if (p === 'gest') validarGestor(d);
  else if (p === 'recv') validarReceptor(d);
  else if (p === 'rec') identificarRec(d);

function validarCred(d) {
  srv('apiPersona', S.token, d).then(function (p) { S.wiz.persona = p; S.wiz.ident = d; S.wiz.err = null; S.wiz.step = 2; S.idAbierto = null; beep('ok'); render(); })
    .catch(function (e) { S.wiz.err = e.message; beep('err'); render(); });
}
function validarGestor(d) {
  srv('apiGestor', S.token, d).then(function (g) { S.scan.gestor = g; S.scan.gestorId = d; S.idAbierto = null; S.scan.fb = { k: 'ok', m: g.nombre + ' se los lleva. Ahora escanea los traspasos.' }; beep('ok'); render(); })
    .catch(function (e) { S.scan.fb = { k: 'err', m: e.message }; beep('err'); render(); });
}
function validarReceptor(d) {
  srv('apiPersona', S.token, d).then(function (q) { S.scan.receptor = q; S.scan.receptorId = d; S.idAbierto = null; S.scan.fb = { k: 'ok', m: 'Recibe ' + q.nombre + '. Ahora escanea los traspasos.' }; beep('ok'); render(); })
    .catch(function (e) { S.scan.fb = { k: 'err', m: e.message }; beep('err'); render(); });
}
function crear() {
  var w = S.wiz;
  w.desc = $('#descin').value.trim();
  if (!w.desc) { w.err = 'Describe qué envías.'; return render(); }
  w.enviando = true; w.err = null; render();
  var d = { destino: w.destino, desc: w.desc, bultos: w.bultos || 1 };
